# T-065 一次性資料深度審計：Drive base dump → 拋棄式 PG 還原 → 盤點報告。
# push 觸發（整合權限無 actions:write，比照 backfill-0827-0828.yml），跑綠取得報告後即刪。
# 排除可重算的因子表（factor_values/composite_daily/factor_cross_stats）省磁碟與時間。
# 服務 PG 的帳密為拋棄式本機容器（runner 生命週期內），非真實秘密。
name: audit-data-depth

on:
  push:
    branches: [claude/data-running-check-8b2zil]
    paths: [".github/workflows/audit-data-depth.yml"]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twquant
          POSTGRES_PASSWORD: twquant
          POSTGRES_DB: twquant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWQUANT_PG_DSN: postgresql://twquant:twquant@localhost:5432/twquant
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --dev --all-groups

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: rclone config（Drive 憑證，Secret 注入）
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: Drive 庫存清點
        run: |
          rclone lsf gdrive:twquant-archive --recursive --files-only --max-depth 4 > inventory.txt
          wc -l inventory.txt

      - name: 下載最新 base dump
        run: |
          BASE=$(rclone lsf gdrive:twquant-archive/base --files-only | sort | tail -1)
          test -n "$BASE" || { echo "::error::Drive base/ 無 dump 檔"; exit 1; }
          echo "使用 base dump：$BASE"
          rclone copy "gdrive:twquant-archive/base/$BASE" . --transfers 4
          mv "$BASE" full.dump && ls -lh full.dump

      - name: pg_restore（排除因子表 TABLE DATA）
        run: |
          pg_restore -l full.dump > full.list
          grep -vE 'TABLE DATA serving (factor_values|composite_daily|factor_cross_stats) ' full.list > filtered.list
          echo "排除 $(($(wc -l < full.list) - $(wc -l < filtered.list))) 個項目"
          pg_restore --no-owner -j 4 -L filtered.list -d "$TWQUANT_PG_DSN" full.dump
          rm full.dump

      - name: 審計
        run: uv run python scripts/audit_data_depth.py --out audit_report.md --drive-inventory inventory.txt

      - name: 上傳報告
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit_report.md
            inventory.txt
