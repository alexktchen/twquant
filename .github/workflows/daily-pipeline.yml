# T-056（D-030）：每日雲端 pipeline——本機關機後的唯一常駐排程。
# 兩班次（Asia/Taipei）：17:33 主跑（行情／法人／估值 16:00～17:00 已公布；缺任何必要表由品質閘門擋下，D-175）；
# 22:43 補跑（融資券 21:30 公布，給隔天用；pipeline 冪等，重跑只補新資料）。
# D-175：準時由 Cloudflare Worker（cron-trigger/）在兩個時點以 workflow_dispatch 帶日期觸發；
# 下面的 schedule 只是備援——2026-10 實測 GHA schedule 常態晚發車約 5 小時。GHA cron 常態晚發車 3-15 分，
# 但 2026-08-27/28 曾延遲 7-10 小時跨過台北午夜——交易日解析見下方 Resolve trading day。
# 分鐘刻意避開每小時起始尖峰；GitHub 官方說尖峰時 schedule 可能延遲甚至被丟棄。
# 失敗通知：GitHub 對 scheduled workflow 失敗會寄信給 repo 擁有者（免額外設定）。
# 已知限制：平日國定假日無行情 → 降級紅燈（~15-20 次/年），屬預期噪音（見 D-030）。
name: daily-pipeline

on:
  schedule:
    - cron: "33 9 * * 1-5" # 17:33 台北（D-175；名單只用 18:00 前的資料，晚上 8 點截點是本機推薦快照的事）
    - cron: "43 14 * * 1-5" # 22:43 台北（補融資券/券商）
  workflow_dispatch:
    inputs:
      date:
        description: "交易日 YYYY-MM-DD（留空＝自動推斷：台北 17:00 前視為前一日、週末回退週五）"
        required: false
        default: ""

concurrency:
  group: daily-pipeline # 兩班次/手動補跑不重疊（資料寫入不併發，比照 JobManager 單一併發）
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 雲端模式：serving 層（sync/materialize/screener/fubon 直寫）與訊號 PG 源全指向
      # Supabase（transaction pooler :6543；store.connect 已停用 prepared statements）
      TWQUANT_PG_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
      TWQUANT_SUPABASE_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --dev --all-groups

      - name: Resolve trading day
        run: |
          DAY="${{ inputs.date }}"
          if [ -z "$DAY" ]; then
            # 不能用 runner 當下日期：schedule 可能延遲跨日/週末。回推最近一個預定班次，
            # 取得原排程所屬日期；平日國定假日仍由品質閘門大聲失敗。
            uv run python scripts/resolve_pipeline_day.py \
              --slot "17:33" --slot "22:43" >> "$GITHUB_ENV"
          else
            # 手動補跑日期由操作者明確指定，優先於自動解析。
            echo "DAY=$DAY" >> "$GITHUB_ENV"
            echo "FROM7=$(date -d "$DAY -7 days" +%F)" >> "$GITHUB_ENV"
          fi

      - name: 模型檔（GitHub Release models-prod-2026-10 → data/models；T-332）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/models
          gh release download models-prod-2026-10 --pattern "models-prod-2026-10.tar.gz" --dir /tmp
          tar -xzf /tmp/models-prod-2026-10.tar.gz -C data/models
          ls data/models

      - name: 月營收（上個月與當月，MOPS；冪等，供應層同步帶進 PG）
        continue-on-error: true # 失敗只亮警告：照樣用已有的月營收算當天推薦
        run: |
          uv run python -m twquant ingest-revenue --month "$(date -d "$DAY -1 month" +%Y-%m)"
          uv run python -m twquant ingest-revenue --month "$(date -d "$DAY" +%Y-%m)"

      - name: 融資券 T-1 補抓（21:30 才公布，前幾日缺口冪等回補）
        continue-on-error: true # 失敗只亮警告：照樣算當天推薦
        run: uv run python -m twquant backfill --from "$FROM7" --to "$DAY" --tables margin_daily --no-skip-existing

      - name: 每日 pipeline（擷取→閘門→因子→打分→每日名單；雲端略過的步驟見 serving.yaml）
        run: uv run python -m twquant pipeline --date "$DAY" --pg-signals --cloud --fail-on-degraded

      - name: 推播通知（今日名單已更新；每個交易日只發一次，T-348）
        # pipeline 降級（紅燈）時名單可能已經寫好，所以照跑；當天沒有名單、或已經發過，這步自己會略過
        if: ${{ !cancelled() }}
        continue-on-error: true # 通知失敗不影響名單
        env:
          TWQUANT_VAPID_PRIVATE_KEY: ${{ secrets.TWQUANT_VAPID_PRIVATE_KEY }}
        run: uv run python -m twquant notify-picks --date "$DAY"

      - name: Install rclone（Drive 歸檔用；排在推薦之後，失敗不影響當天名單）
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: rclone config（Drive 歸檔憑證，Secret 注入）
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: 每日增量歸檔 → Drive（保命線，D-030）
        if: ${{ !cancelled() }}
        continue-on-error: true # 歸檔失敗不影響當天名單（推薦優先，使用者 2026-10-10）
        run: |
          uv run python -m twquant archive-daily --date "$DAY" --out archive_out
          rclone copy archive_out gdrive:twquant-archive/daily --transfers 4
          rclone check archive_out gdrive:twquant-archive/daily --one-way

      - name: 滾動窗口修剪（Supabase 500 MB 防線）
        if: ${{ !cancelled() }} # 前面任何一步失敗都要修剪，免得超過免費額度
        run: uv run python -m twquant serving prune
