# T-056（D-030）：每日雲端 pipeline——本機關機後的唯一常駐排程。
# 兩班次（Asia/Taipei）：19:23 主跑（行情/法人已公布）；22:43 補跑（融資券 21:30、
# 券商分點晚間公布；pipeline 冪等，重跑只補新資料）。GHA cron 常態晚發車 3-15 分，
# 但 2026-08-27/28 曾延遲 7-10 小時跨過台北午夜——交易日解析見下方 Resolve trading day。
# 分鐘刻意避開每小時起始尖峰；GitHub 官方說尖峰時 schedule 可能延遲甚至被丟棄。
# 失敗通知：GitHub 對 scheduled workflow 失敗會寄信給 repo 擁有者（免額外設定）。
# 已知限制：平日國定假日無行情 → 降級紅燈（~15-20 次/年），屬預期噪音（見 D-030）。
name: daily-pipeline

on:
  schedule:
    - cron: "23 11 * * 1-5" # 19:23 台北
    - cron: "43 14 * * 1-5" # 22:43 台北（補融資券/券商）
  workflow_dispatch:
    inputs:
      date:
        description: "交易日 YYYY-MM-DD（留空＝自動推斷：台北 17:00 前視為前一日、週末回退週五）"
        required: false
        default: ""

concurrency:
  group: daily-pipeline # 兩班次/手動補跑不重疊（資料寫入不併發，比照 JobManager 單一併發）
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 雲端模式：serving 層（sync/materialize/screener/fubon 直寫）與訊號 PG 源全指向
      # Supabase（transaction pooler :6543；store.connect 已停用 prepared statements）
      TWQUANT_PG_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
      TWQUANT_SUPABASE_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --dev --all-groups

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: rclone config（Drive 歸檔憑證，Secret 注入）
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: Resolve trading day
        run: |
          DAY="${{ inputs.date }}"
          if [ -z "$DAY" ]; then
            # 不能用 runner 當下日期：schedule 可能延遲跨日/週末。回推最近一個預定班次，
            # 取得原排程所屬日期；平日國定假日仍由品質閘門大聲失敗。
            uv run python scripts/resolve_pipeline_day.py \
              --slot "19:23" --slot "22:43" >> "$GITHUB_ENV"
          else
            # 手動補跑日期由操作者明確指定，優先於自動解析。
            echo "DAY=$DAY" >> "$GITHUB_ENV"
            echo "FROM7=$(date -d "$DAY -7 days" +%F)" >> "$GITHUB_ENV"
          fi

      - name: 融資券 T-1 補抓（21:30 才公布，前幾日缺口冪等回補）
        run: uv run python -m twquant backfill --from "$FROM7" --to "$DAY" --tables margin_daily --no-skip-existing

      - name: 每日 pipeline（擷取→閘門→券商→訊號(PG)→供應層→選股池）
        run: uv run python -m twquant pipeline --date "$DAY" --pg-signals --fail-on-degraded

      - name: 券商買賣超日聚合（broker_flow_daily，明細修剪前）
        run: uv run python -m twquant serving broker-flow --from "$DAY" --to "$DAY"

      - name: 每日增量歸檔 → Drive（保命線，D-030）
        run: |
          uv run python -m twquant archive-daily --date "$DAY" --out archive_out
          rclone copy archive_out gdrive:twquant-archive/daily --transfers 4
          rclone check archive_out gdrive:twquant-archive/daily --one-way

      - name: 滾動窗口修剪（Supabase 500 MB 防線）
        run: uv run python -m twquant serving prune
