# T-332：雲端網站部署到 Cloudflare Pages（前端靜態檔＋frontend/functions 的 API，直連 Supabase）。
# 需要的 repo secrets：
#   CLOUDFLARE_API_TOKEN   Cloudflare 自訂 token，權限 Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 帳號 ID（後台 Workers & Pages 右側欄）
#   TWQUANT_SUPABASE_DSN   既有（每日 pipeline 也用它）；部署時寫進 Pages 的祕密 TWQUANT_PG_DSN
#   FUGLE_API_KEY          選填：富果行情 API 金鑰；部署時寫進 Pages 的祕密 FUGLE_API_KEY，證交所擋下即時報價時用富果補
# main 上前端有改動就自動部署；也可在 Actions 頁手動觸發。
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: twquant
    steps:
      - uses: actions/checkout@v4

      - name: 檢查祕密
        id: secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${{ secrets.TWQUANT_SUPABASE_DSN }}" ] || missing="$missing TWQUANT_SUPABASE_DSN"
          if [ -n "$missing" ]; then
            # 還沒設 token 時改由本機 `npx wrangler pages deploy` 部署（2026-10-10 起）；這裡只留警告不報錯
            echo "::warning::缺少 repo secrets:$missing——本次不自動部署"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'

      - name: 前端單元測試
        if: steps.secrets.outputs.ok == 'true'
        run: npm test

      - name: 建置雲端版
        if: steps.secrets.outputs.ok == 'true'
        run: npm run build
        env:
          VITE_APP_MODE: cloud

      - name: Pages 專案（不存在才建）
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "專案 $PROJECT 已存在"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      - name: 資料庫連線祕密（Pages Functions 用）
        if: steps.secrets.outputs.ok == 'true'
        env:
          DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
        run: printf '%s' "$DSN" | npx --yes wrangler@4 pages secret put TWQUANT_PG_DSN --project-name "$PROJECT"

      - name: 富果行情金鑰（選填；證交所擋下即時報價時的備援）
        if: steps.secrets.outputs.ok == 'true'
        env:
          FUGLE: ${{ secrets.FUGLE_API_KEY }}
        run: |
          if [ -z "$FUGLE" ]; then
            echo "沒有設 FUGLE_API_KEY：即時報價只用證交所"
            exit 0
          fi
          printf '%s' "$FUGLE" | npx --yes wrangler@4 pages secret put FUGLE_API_KEY --project-name "$PROJECT"

      - name: 部署
        if: steps.secrets.outputs.ok == 'true'
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main | tee deploy.log
          url=$(grep -oE "https://[a-z0-9.-]+\.pages\.dev" deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::部署輸出裡找不到網址"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 網站：$url" >> "$GITHUB_STEP_SUMMARY"

      - name: 部署後檢查（網站與 API）
        if: steps.secrets.outputs.ok == 'true'
        env:
          # Cloudflare Access 只保護 /api（網站外殼公開，沒登入看到模糊預覽）。
          # 有 Access 服務權杖（repo secrets）就帶上它驗證 API 內容；沒有時 API 必須被擋（302/401/403），
          # 沒登入就回 200 等於名單外洩 → 部署檢查失敗。
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          url="${{ steps.deploy.outputs.url }}"
          auth=()
          if [ -n "$ACCESS_ID" ] && [ -n "$ACCESS_SECRET" ]; then
            auth=(-H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET")
          fi
          for path in / /api/picks/dates /api/picks; do
            code=""
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "${auth[@]}" "$url$path" || true)
              [ "$code" = "200" ] && break
              if [ ${#auth[@]} -eq 0 ] && { [ "$code" = "302" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; }; then break; fi
              sleep 10
            done
            echo "$url$path -> $code"
            if [ ${#auth[@]} -eq 0 ] && [ "${path#/api/}" != "$path" ] && [ "$code" = "200" ]; then
              echo "::error::$path 沒登入就回 200：名單外洩，檢查 Cloudflare Access 是否還保護 /api"; exit 1
            fi
            if [ "$code" = "200" ]; then continue; fi
            if [ ${#auth[@]} -eq 0 ] && { [ "$code" = "302" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; }; then
              echo "::notice::$path 受 Cloudflare Access 保護（$code），未驗證內容；要驗證請加 CF_ACCESS_CLIENT_ID／SECRET"
              continue
            fi
            echo "::error::$path 回 $code"; exit 1
          done
          # 公開的交易日清單：要真的回日期 JSON（Pages 對不存在的路徑會回首頁 HTML，一樣是 200）
          ok=""
          for i in 1 2 3 4 5 6; do
            if curl -s "$url/pub/dates" | grep -q '"dates"'; then ok=1; break; fi
            sleep 10
          done
          if [ -z "$ok" ]; then echo "::error::/pub/dates 沒回日期 JSON（沒登入的人會看不到歷史日期）"; exit 1; fi
          echo "$url/pub/dates -> dates JSON"
