# 一次性：T-067 `ml train` 首次真實資料訓練煙霧（研究軌，SPEC-010 §4）。
# 重跑 #3：診斷輔助（label join 健康度、逐窗進度、失敗帶窗上下文）＋標籤宇宙改四碼普通股。
# 重跑 #2：run #1 於 ml train 載入特徵時遭 runner shutdown（疑整表拉 2,300 萬列
# factor_values OOM）——已改逐因子 server 端過濾讀取（ml_store.read_factor_frames）。
# Drive base dump（含 factor_values 特徵）→ 拋棄式 PG → 逐因子覆蓋盤點 →
# walk-forward 訓練 → 模型/OOS 分數/research_log 上傳 artifact。跑綠取結果後即刪。
# push 觸發（整合權限無 actions:write）；服務 PG 帳密為拋棄式本機容器，非真實秘密。
name: ml-first-train

on:
  push:
    branches: [claude/data-running-check-8b2zil]
    paths: [".github/workflows/ml-first-train.yml"]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twquant
          POSTGRES_PASSWORD: twquant
          POSTGRES_DB: twquant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWQUANT_PG_DSN: postgresql://twquant:twquant@localhost:5432/twquant
    steps:
      - uses: actions/checkout@v4

      - name: 釋放 runner 磁碟（同 audit-data-depth 的教訓）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --dev --all-groups

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: rclone config（Drive 憑證，Secret 注入）
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: 下載最新 base dump
        run: |
          BASE=$(rclone lsf gdrive:twquant-archive/base --files-only | sort | tail -1)
          test -n "$BASE" || { echo "::error::Drive base/ 無 dump 檔"; exit 1; }
          echo "使用 base dump：$BASE"
          rclone copy "gdrive:twquant-archive/base/$BASE" . --transfers 4
          mv "$BASE" full.dump && ls -lh full.dump

      - name: pg_restore（含 factor_values 特徵；不建索引、排除可重算的綜合表）
        run: |
          pg_restore -l full.dump > full.list
          grep -vE 'TABLE DATA serving (composite_daily|factor_cross_stats) ' full.list > filtered.list
          pg_restore --no-owner -j 4 --section=pre-data --section=data \
            -L filtered.list -d "$TWQUANT_PG_DSN" full.dump
          rm full.dump && df -h / | tail -1

      - name: 特徵覆蓋盤點（factor_values 逐因子起迄——回填 T-065 審計）
        run: |
          psql "$TWQUANT_PG_DSN" -c "SELECT factor, min(date), max(date), count(*) FROM serving.factor_values GROUP BY 1 ORDER BY 1"
          echo "FV_FROM=$(psql "$TWQUANT_PG_DSN" -tAc 'SELECT min(date) FROM serving.factor_values')" >> "$GITHUB_ENV"
          echo "FV_TO=$(psql "$TWQUANT_PG_DSN" -tAc 'SELECT max(date) FROM serving.factor_values')" >> "$GITHUB_ENV"

      - name: ml train（walk-forward＋部署模型落地＋research_log 登記）
        run: uv run python -m twquant ml train --from "$FV_FROM" --to "$FV_TO" --out models_out

      - name: 上傳模型與登記
        uses: actions/upload-artifact@v4
        with:
          name: ml-first-train
          path: |
            models_out
            data/research_log
