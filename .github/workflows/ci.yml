name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        # 含 dashboard 群組：mypy 需 streamlit 型別（否則 @st.cache_data 判為 untyped decorator）
        run: uv sync --dev --group dashboard
      - name: Gate (ruff + mypy + pytest)
        run: uv run python -m twquant check
