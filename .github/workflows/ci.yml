name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        # 含 api 群組：mypy/pytest 需 fastapi 型別與 TestClient
        run: uv sync --dev --group api
      - name: Gate (ruff + mypy + pytest)
        run: uv run python -m twquant check
