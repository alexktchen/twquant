# 一次性：T-069 階梯第 3 級——ML 策略成本後回測（SPEC-010 §7）。
# 前兩級已通過（ML RankIC +0.0815 對最強基準 D-020 子集 +0.0369 勝出 2.2 倍），
# 但排序能力 ≠ 扣完成本還賺錢。本輪：還原 PG → ml train → 把 walk-forward 的
# **樣本外**分數寫進 ml_scores（回測必須用當時的模型，非最終模型回頭推論）→
# 跑 ml_rank 策略回測，並以既有 reversal_revenue 策略為對照。
# 觀察重點是 turnover（年化單邊）：ML 分數波動高於線性組合，來回成本含 0.3%
# 證交稅可能吃掉 IC 優勢。跑綠取結果後即刪。
#
# 重跑 #2：首輪回測 46 分鐘未完成、runner 於 60 分被砍（log 404，OOM 徵狀）。
# 根因是既有架構特性——universe_ids 每個訊號日都對**整張** prices_daily（907 萬列）
# 排序＋rolling_median＋兩輪 cum_sum window，48 個訊號日重複 48 次。繞法：訓練完成後
# 把 PG 的 prices 砍到「回測期間 + 120 日回看」（涵蓋 20 日 ADV 與 60 列衛生濾網），
# 約 907 萬 → 60 萬列；並先跑 1 個月 smoke 確認鏈路，再跑全期。
name: ml-backtest

on:
  push:
    branches: [claude/data-running-check-8b2zil]
    paths: [".github/workflows/ml-backtest.yml"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twquant
          POSTGRES_PASSWORD: twquant
          POSTGRES_DB: twquant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWQUANT_PG_DSN: postgresql://twquant:twquant@localhost:5432/twquant
    steps:
      - uses: actions/checkout@v4

      - name: 釋放 runner 磁碟
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --dev --all-groups

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: rclone config（Drive 憑證，Secret 注入）
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: 下載最新 base dump
        run: |
          BASE=$(rclone lsf gdrive:twquant-archive/base --files-only | sort | tail -1)
          test -n "$BASE" || { echo "::error::Drive base/ 無 dump 檔"; exit 1; }
          rclone copy "gdrive:twquant-archive/base/$BASE" . --transfers 4
          mv "$BASE" full.dump

      # 回測需要索引（逐訊號日查價），與純評估不同——這裡還原完整 section
      - name: pg_restore（完整，含索引）
        run: |
          pg_restore -l full.dump > full.list
          grep -vE 'TABLE DATA serving (composite_daily|factor_cross_stats) ' full.list > filtered.list
          pg_restore --no-owner -j 4 -L filtered.list -d "$TWQUANT_PG_DSN" full.dump || true
          rm full.dump && df -h / | tail -1

      - name: 訓練區間判定（洞＝月資料日 < 10）
        run: |
          FV_FROM=$(psql "$TWQUANT_PG_DSN" -tAc "
            WITH b AS (SELECT date_trunc('month', min(date))::date lo, date_trunc('month', max(date))::date hi FROM serving.factor_values),
            months AS (SELECT generate_series((SELECT lo FROM b), (SELECT hi FROM b), '1 month')::date mo),
            cov AS (SELECT date_trunc('month', date)::date mo, count(DISTINCT date) d FROM serving.factor_values GROUP BY 1),
            holes AS (SELECT m.mo FROM months m LEFT JOIN cov c USING (mo) WHERE coalesce(c.d, 0) < 10 AND m.mo < (SELECT hi FROM b))
            SELECT CASE WHEN (SELECT count(*) FROM holes) = 0 THEN (SELECT min(date) FROM serving.factor_values)
                   ELSE (SELECT min(date) FROM serving.factor_values WHERE date >= (SELECT max(mo) FROM holes) + interval '1 month') END")
          echo "FV_FROM=$FV_FROM" >> "$GITHUB_ENV"
          echo "FV_TO=$(psql "$TWQUANT_PG_DSN" -tAc 'SELECT max(date) FROM serving.factor_values')" >> "$GITHUB_ENV"

      - name: ml train
        run: uv run python -m twquant ml train --from "$FV_FROM" --to "$FV_TO" --out models_out

      - name: ml backfill-scores（walk-forward 樣本外分數 → ml_scores）
        run: |
          MDIR=$(ls -d models_out/*/ | head -1)
          echo "MDIR=$MDIR" >> "$GITHUB_ENV"
          uv run python -m twquant ml backfill-scores --model "$MDIR"
          psql "$TWQUANT_PG_DSN" -c "SELECT min(date), max(date), count(*), count(DISTINCT stock_id) FROM serving.ml_scores"

      - name: 回測區間（ml_scores 的樣本外範圍）
        run: |
          echo "BT_FROM=$(psql "$TWQUANT_PG_DSN" -tAc 'SELECT min(date) FROM serving.ml_scores')" >> "$GITHUB_ENV"
          echo "BT_TO=$(psql "$TWQUANT_PG_DSN" -tAc 'SELECT max(date) FROM serving.ml_scores')" >> "$GITHUB_ENV"

      # 回測只需「回測期間 + 回看窗」的價格：20 日 ADV + 60 列衛生濾網 → 120 曆日足夠。
      # 必須在 ml train 之後（訓練標籤需要完整歷史），砍完 VACUUM 讓查詢真的變快。
      - name: 修剪 prices_daily 至回測所需窗口（繞過 universe_ids 全表重算）
        run: |
          psql "$TWQUANT_PG_DSN" -c "SELECT count(*) AS before_rows FROM serving.prices_daily"
          psql "$TWQUANT_PG_DSN" -c "DELETE FROM serving.prices_daily WHERE date < DATE '$BT_FROM' - INTERVAL '120 days'"
          psql "$TWQUANT_PG_DSN" -c "VACUUM ANALYZE serving.prices_daily"
          psql "$TWQUANT_PG_DSN" -c "SELECT count(*) AS after_rows, min(date), max(date) FROM serving.prices_daily"

      - name: 回測 smoke（首月，先確認鏈路與速度）
        run: |
          SMOKE_END=$(date -d "$BT_FROM +35 days" +%F)
          echo "smoke 區間 $BT_FROM ~ $SMOKE_END"
          timeout 900 uv run python -m twquant backtest --strategy configs/strategies/ml_rank.yaml \
            --start "$BT_FROM" --end "$SMOKE_END" --pg | tee bt_smoke.txt

      - name: 回測 ml_rank（受測）
        run: |
          timeout 2100 uv run python -m twquant backtest --strategy configs/strategies/ml_rank.yaml \
            --start "$BT_FROM" --end "$BT_TO" --pg | tee bt_ml.txt

      - name: 回測 reversal_revenue（既有策略對照，同期間同成本）
        run: |
          timeout 2100 uv run python -m twquant backtest --strategy configs/strategies/reversal_revenue.yaml \
            --start "$BT_FROM" --end "$BT_TO" --pg | tee bt_base.txt || true

      - name: 上傳結果
        if: always() # 全期若再度超時，至少保住 smoke 結果
        uses: actions/upload-artifact@v4
        with:
          name: ml-backtest
          path: |
            bt_smoke.txt
            bt_ml.txt
            bt_base.txt
            models_out
            data/research_log
