# T-377（D-188）：晨報——台北 06:30 的第三班。T-409（2026-10-19）：盤後快訊——台北 17:45 再跑一次（--edition evening，寫 evening_brief；2026-10-20 由 21:45 改 17:45），先等今天的大盤體檢（最多 60 分鐘）。美股 05:00 收、台指期夜盤 05:00 收，收齊昨晚到今早的數字寫進
# serving.morning_brief，首頁戰情室早上打開才是新的。只有一個步驟、不碰名單；失敗只是首頁沒有今天的晨報。
# D-175：準時由 Cloudflare Worker（cron-trigger/）06:30 以 workflow_dispatch 帶日期觸發；下面的 schedule 是備援
# （GHA schedule 常態晚發車，晚個把小時也還在早上）。週六不跑（沒有夜盤、美股週五晚收盤的數字週一早上才用得到）。
name: morning-brief

on:
  schedule:
    - cron: "40 22 * * 0-4" # 06:40 台北，週一到週五（UTC 週日到週四）
    - cron: "55 9 * * 1-5" # 17:55 台北，週一到週五：盤後快訊的備援（T-409；GHA 排程常晚發車）
  workflow_dispatch:
    inputs:
      date:
        description: "晨報日 YYYY-MM-DD（留空＝台北今天）"
        required: false
        default: ""
      edition:
        description: "morning＝盤前晨報；evening＝盤後快訊（留空＝morning）"
        required: false
        default: ""

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # 盤後快訊最多等 60 分鐘大盤體檢
    env:
      TWQUANT_PG_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
      TWQUANT_SUPABASE_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
      # 模型晨報走 Cloudflare Workers AI（D-185）；沒設就只有規則那一句
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --dev --all-groups

      # 版本看是哪條排程觸發的，不看幾點跑（2026-10-20 實見：21:55 的備援晚了 5.5 小時、03:31 才跑，照「12 點前＝盤前」寫成了隔天的盤前晨報）。
      # 盤後的備援：日期往回 8 小時算（晚到隔天凌晨還是算前一天），已經有那天的盤後快訊（Worker 那班做好了）就跳過。
      - name: Resolve day 與版本
        run: |
          DAY="${{ inputs.date }}"
          EDITION="${{ inputs.edition }}"
          SKIP=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "55 9 * * 1-5" ]; then
              EDITION=evening
              DAY="$(TZ=Asia/Taipei date -d '-8 hours' +%F)"
              SKIP="--skip-existing"
            else
              EDITION=morning
            fi
          fi
          if [ -z "$DAY" ]; then DAY="$(TZ=Asia/Taipei date +%F)"; fi
          if [ -z "$EDITION" ]; then EDITION=morning; fi
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "EDITION=$EDITION" >> "$GITHUB_ENV"
          echo "SKIP=$SKIP" >> "$GITHUB_ENV"

      - name: 晨報或盤後快訊（行情＋體檢、籌碼、公告、新聞 → 規則一句話＋模型五到六點）
        run: uv run python -m twquant morning-brief --date "$DAY" --edition "$EDITION" $SKIP
