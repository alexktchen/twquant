# T-423（D-204）：從網站登入 LINE 發文帳號。網站「LINE 群組」分頁按「登入」→ /api/line/login 以 workflow_dispatch
# 觸發這裡（Pages 祕密 TWQUANT_DISPATCH_TOKEN）→ 轉接器掃 QR 登入，QR 與 PIN 一出來就寫進 web.line_login，
# 網站每幾秒讀一次顯示；用備用帳號的手機掃、輸入 PIN，憑證存 web.line_account。等掃描最多 3 分鐘。
# ⚠ linejs 是 LINE 非官方協定、這台機器在美國（國外 IP 上線可能被鎖）——只用備用帳號。
name: line-login

on:
  workflow_dispatch:

concurrency:
  group: line-login
  cancel-in-progress: true # 再按一次「登入」就換新的 QR

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWQUANT_SUPABASE_DSN: ${{ secrets.TWQUANT_SUPABASE_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync deps（只裝登入要的：資料庫＋QR）
        run: |
          uv sync --group serving --group line
          npm ci --prefix line-poster --no-audit --no-fund

      - name: 掃 QR 登入（QR 與 PIN 顯示在網站「LINE 群組」分頁）
        run: uv run --no-sync python -m twquant line-group login # 不讓 uv run 依預設群組重新同步
