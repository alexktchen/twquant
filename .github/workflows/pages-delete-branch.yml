# 刪掉 Cloudflare Pages 某個預覽分支的全部部署（分支別名與各次部署網址都讀不到）。
# 使用者 2026-10-15：「https://reports.twquant.pages.dev/reports/ 這個頁面拿掉不要讓人家讀了」——
# 那是以前直接上傳的預覽部署（wrangler --branch reports），不是 git 分支，只能用 API 刪。
# 正式分支（main）腳本會拒絕。憑證沿用 deploy-web 的 CLOUDFLARE_API_TOKEN（Pages › Edit）與 CLOUDFLARE_ACCOUNT_ID。
name: pages-delete-branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要刪掉的預覽分支（例：reports）；main 會被拒絕"
        required: true
        default: "reports"

concurrency:
  group: deploy-web # 與部署不重疊
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - name: 刪除預覽分支的部署並確認讀不到
        run: python3 scripts/pages_delete_branch.py --project twquant --branch "$BRANCH"
