# 族群資金（D-177 修訂；門檻寫於看到任何族群資金數字之前）。只是觀察用的標記，不是買賣訊號。
# 資金倍數＝當天族群成交金額佔全市場（四碼普通股）的比重 ÷ 前 avg_sessions 個交易日的平均比重。
flow:
  avg_sessions: 20
  hot_ratio: 1.5 # 資金倍數 ≥ 1.5……
  hot_breadth: 0.6 # ……而且有成交的成員至少六成上漲，才標「資金流入」
  hot_min_members: 3 # 當天有成交的成員少於 3 檔不標
  max_members: 8 # 族群排行每個族群列成交金額前 8 檔

# 族群法人（D-177 修訂三，T-358）：族群頁的象限圖，看法人的錢往哪個族群跑。只供顯示與觀察，不進模型、不進名單。
# 每天每個族群的法人買賣超（金額）＝成員當天三大法人買賣超股數 × 當天收盤，上市讀 institutional_daily、
# 上櫃直接抓櫃買中心「三大法人買賣明細」。
inst:
  window: 5 # x 軸＝近 5 個交易日的法人買賣超合計；y 軸＝加速＝（近 5 日合計 − 再前 5 日合計）÷ 5，每天比前一段多買多少
  trail: 5 # 選中的族群畫出最近 5 個交易日在圖上的位置（第一次上線要回補 2×window＋trail−1 個交易日）
  close_lookback_days: 30 # 法人只買賣零股／鉅額、當天沒有一般交易（沒有收盤）的股票，用這麼多日曆天內最近一個收盤換算金額
