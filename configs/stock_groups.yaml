# 推薦股的族群標籤（D-177）。網站「每日名單」每一檔旁邊的小字，例：大毅、日電貿 → 被動元件。
#
# 來源：櫃買中心「產業價值鏈資訊平台」https://ic.tpex.org.tw 的產業鏈（上市、上櫃、興櫃公司都有）。
# 一檔常掛好幾條鏈，挑法（src/twquant/data/stock_groups.py）：
#   ① 官方產業別（stock_meta.industry）先圈出候選鏈——下面 refine 列的；
#   ② 候選裡取這檔掛最多段的那條；③ 一樣多時取列在越前面的。
# 沒有候選 → 網站顯示官方產業別。refine 寫到平台上沒有的鏈名會 raise（平台改名時不悄悄失效）。
# 只是顯示用的標籤：不進因子、不進模型、不影響名單。

base_url: https://ic.tpex.org.tw
first_chain: D000 # 半導體；它的頁面有全部產業鏈的選單
timeout_seconds: 60 # 一頁 100～300 KB
refresh_days: 7 # 族群表比這舊才重抓（每天 pipeline 都會檢查一次）

refine:
  # 電子：越專門的鏈放越前面，大而泛的（電腦及週邊設備、通信網路）放後面；題材型的鏈（人工智慧、雲端運算）放最後
  半導體業: [半導體]
  電腦及週邊設備業: [電腦及週邊設備]
  通信網路業: [通信網路, 太空衛星科技]
  電子零組件業: [被動元件, 連接器, 印刷電路板, 觸控面板, 能源元件, 半導體, 平面顯示器, 通信網路, 電腦及週邊設備]
  光電業: [平面顯示器, 觸控面板, 電腦及週邊設備, LED照明產業, 太陽能產業, 半導體, 通信網路]
  電子通路業: [半導體, 被動元件, 連接器, 通信網路, 電腦及週邊設備]
  其他電子業: [被動元件, 連接器, 印刷電路板, 能源元件, 自動化, 半導體, 平面顯示器, 通信網路, 電腦及週邊設備]
  資訊服務業: [資通訊安全, 電子商務, 金融科技, 軟體服務, 雲端運算, 大數據, 人工智慧]
  數位雲端: [電子商務, 資通訊安全, 軟體服務, 雲端運算, 大數據, 人工智慧]
  # 機電、能源
  電機機械: [自動化, 智慧電網, 風力發電, 電動車輛產業, 電機機械]
  電器電纜: [智慧電網, 電機機械]
  綠能環保: [太陽能產業, 風力發電, 汽電共生, 能源元件, 智慧電網]
  油電燃氣業: [油電燃氣, 汽電共生]
  汽車工業: [汽車, 電動車輛產業]
  # 生技
  生技醫療業: [製藥, 醫療器材, 再生醫療, 食品生技]
  農業科技業: [食品生技, 食品]
  # 傳產：本業那條鏈放第一，題材型的鏈放後面；鏈名跟官方產業別差不多，但段落更細（例：長榮 → 交通運輸及航運／貨櫃航運）
  水泥工業: [水泥]
  食品工業: [食品, 食品生技]
  塑膠工業: [石化及塑橡膠]
  橡膠工業: [石化及塑橡膠]
  化學工業: [石化及塑橡膠]
  紡織纖維: [紡織, 運動科技]
  造紙工業: [造紙]
  鋼鐵工業: [鋼鐵]
  建材營造業: [建材營造]
  航運業: [交通運輸及航運]
  觀光餐旅: [休閒娛樂]
  運動休閒: [休閒娛樂, 運動科技]
  金融保險業: [金融, 金融科技]
  貿易百貨業: [貿易百貨, 電子商務]
  文化創意業: [文化創意業]
  # 平台沒有對應的鏈：顯示官方產業別
  玻璃陶瓷: []
  居家生活: []
  其他業: []
