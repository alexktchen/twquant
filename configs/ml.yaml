# ML 排序層配置（SPEC-010 §1 權威欄位；MlConfig extra="forbid"）。
# 訓練資料源＝完整歷史 PG（本機還原/歸檔庫），Supabase 滾動窗口禁作訓練源（SPEC-010 §0）。
horizon_days: 10 # 主標籤視窗（交易日）；證交稅 0.3% 決定頻率下限（研究藍圖 §4）
aux_horizons: [5, 20] # 對照視窗（僅評估）
features: [] # 空＝訓練時解析為全部註冊因子（Phase 1 不新造特徵）
context_features: [] # Phase 2 再開：market_cap_bucket/board/industry/near_limit/range_20d
label:
  execution: next_open # 報酬起點 t+1 開盤（與策略 execution: next_open 對齊）
  excess: market_mean # 超額化基準＝同日宇宙均值
  transform: rank_pct # 當日橫斷面百分位（漲跌停截斷肥尾在 rank 下免疫）
  total_return: false # D-054：凍結模型（Phase 1 H10）的原始配方＝未含股利；新配置一律 true
split:
  train_min_years: 2.0 # 首窗最短年數；T-065 審計定案（訓練期 2020~ 今 6.5 年，SPEC-010 §2）
  test_months: 3
  embargo_days: 10 # 須 ≥ horizon_days（MlConfig 驗證）
  vault_months: 6 # 金庫期：最後 N 個月凍結，僅最終定案時評估一次
  days_per_year: 244 # 台股年交易日近似（年/月→交易日換算基數）
  days_per_month: 21
lgbm: # 只暴露這幾個；決定性旗標（deterministic 等）由 train.py 固定注入
  num_leaves: 31
  learning_rate: 0.05
  min_data_in_leaf: 100
  feature_fraction: 0.8
  n_estimators: 400
  seed: 42
refit:
  schedule: monthly
trials_log: research_log

# 每日推論使用的選股模型（T-224）。八個模型的 train_end 全同，自動選會挑到 D-075 的
# 回撤風控模型，故改為明寫。換模型＝改這一行；空字串＝不綁定，pipeline 會略過而非亂猜。
production_ranking_model: lgbm_lw_net_h20_20260225_83890036 # D-110：換成長窗口模型
# 換的依據（D-089／D-107）：共同測試期 983 個交易日上 +0.0629 vs 短窗口 +0.0452；
# 訓練涵蓋 2018Q4／2020／2022 三個壓力體制；金庫期（未見資料）+0.0816。
# **部署的是排序不是策略**——D-107 判定沒有任何一支策略可部署，本綁定不改變那件事。
# 原綁定 lgbm_net_h20_20260225_6a798962（短窗口）保留在 data/models/，可隨時換回。

# 每天額外要推論並寫進 PG 的模型（D-112）。D-163 只留兩條線之後，LW-F1 已下架，不再需要營收驚奇模型。
production_aux_models: []

# D-147 的研究模型（TAIL-B）已隨 D-163 下架；需要時再列回來。
research_live_models: []

# D-163 潛伏飆股（QUIET）：安靜股 A20 模型每日推論（`ml/quiet_live.py`，池子與訓練同一組函數）。
quiet_live_model: lgbm_quietA20_tu_h20_20260430_655df6d7
quiet_live_config: ml_quiet_a20.yaml

# ML 選股名單的晉級門檻（D-111）。在此之前所有候選一律 ml_candidate，
# 於是畫面上「每天推薦 200 檔」——那其實是 API 的 page_size，不是模型選的。
# 檔數不是新發明的數字：20 是 118 格回測實際用的組合大小，50 是 D-104 分散度階梯的下一個節點。
recommendation_buckets:
  enabled: true
  top_n: 20            # ml_top20：過閘門後的前 20 名，畫面預設只顯示這一組
  watch_n: 50          # ml_watch：第 21~50 名
  # 風控閘門用 D-075 的回撤模型，用途寫死為閘門、不得進排序。
  # 被剔除者標 ml_risk_excluded 而非刪除——被剔除這件事本身是資訊。
  risk_gate_model: lgbm_lw_dd_h60_20260225_1bd7c6a0
  risk_gate_keep_pct: 0.9
  # 流動性閘門（D-113，使用者 2026-09-19：「剔除交易量太小的個股」）。
  # 兩個數字與全部長窗口回測的 universe 區塊逐字相同——20 日成交金額中位數在前 30%、收盤 ≥ 10 元。
  # 被剔除者標 ml_liquidity_excluded，照樣留在快照裡。
  liquidity_min_adv_pctl: 0.70
  liquidity_min_price: 10.0
