# G4「ML ＋ 分數 EMA 平滑」
#
# **家族：G 系列（ML 濾網矩陣）。事前登記見 DECISIONS D-072。**
#
# 基準是 L0-new（ML 訊號、20 檔等權、無額外濾網），本格 = 基準 **只加這一個濾網**。
# 故「這個濾網值多少」= 本格 − L0-new，是乾淨的邊際效果。
#
# `smooth_days: 10` 對每檔自己的 ML 分數做 EMA。針對 900%+ 的周轉。**D-046 測過並失敗（Sharpe 0.16）**，但那是舊模型、舊資料；此處重測。
#
# **判讀規則（D-072 事前寫定）**：本批格數多，「最好的那格」幾乎必然是運氣。
# 正確讀法是**每個濾網的邊際效果**，不是挑冠軍。挑冠軍即規格搜尋，DSR 會被稀釋。
#
# 未經部署裁決，勿用於實盤。
name: track_g4_ml_smooth
description: G 系列 G4：ML + 分數 EMA 平滑
trial_scope: ml_gate_matrix
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: 30000000
  min_price: 10.0
combine: zscore_weighted
signals:
- factor: ml.lgbm_net_20d
  weight: 1.0
  params:
    model_id: lgbm_net_h20_20260225_6a798962
    smooth_days: 10
selection:
  method: top_n
  top_n: 20
weighting: equal
max_weight_per_stock: 0.05
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
