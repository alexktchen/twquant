# D-184（2026-10-15，事前登記）：大盤精選（E0）加大盤緩跌閘門——與 lw_e0_ctrl 逐字相同，只多 market_gate：
# 換股日當晚加權在 60 日線下、20 日波動未到自身過去 250 日第 90 百分位（緩跌）→ 隔天開盤只賣不買
# （掉出前 15 名的全賣、超出目標的減碼；新進與加碼都取消），錢留現金到下一個換股日。
# **RESEARCH ONLY**，在第二保留期（2027-03 開）與 lw_e0_ctrl 一起判讀；開啟前不得修改（configs/holdout2_weak_filters.yaml 守著）。
name: lw_e0_grind_gate
description: D-184 E0 ＋ 大盤緩跌閘門（換股日緩跌只賣不買）
trial_scope: lw:e0_market_gate
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
prefilter:
- factor: ml.lgbm_lw_net_20d
  keep_pct: 0.3
  params:
    model_id: lgbm_lw_net_h20_20260225_83890036
combine: rank_avg
signals:
- factor: price.high_52w
  weight: 0.35
- factor: price.mom_60d
  weight: 0.25
- factor: volume.turnover_z_20d
  weight: 0.25
- factor: price.rs_market_20d
  weight: 0.15
require_all_factors: true
selection:
  method: top_n
  top_n: 15
weighting: equal
max_weight_per_stock: 0.1
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
exit_rules: []
market_gate: # D-184（規則與參數逐字沿用 D-124 §三 b1）：加權在季線下、波動未到恐慌＝緩跌，換股日只賣不買
  index_id: TAIEX
  ma_window: 60
  vol_window: 20
  vol_lookback: 250
  vol_pctl: 0.90
