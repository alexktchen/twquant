# D-174（2026-10-11，使用者：「好，上線變第三條」）：第三條線「潛伏飆股・高分爆量」，**驗證中**。
# 與 quiet_p35 逐字相同，只多一個進場必要條件：當天爆量（D-173 排列組合裡描述最好的一組：H35＋量能）。
# 看板與網站每日列出、2027-03 在第二保留期判讀（configs/holdout2_quiet_volume.yaml 守著，開啟前不得修改）。
name: quiet_p35v
description: 潛伏飆股・高分爆量：A20 機率 ≥ 0.35 且當天成交量 ≥ 前 20 日均量 1.5 倍、抱滿 20 日
trial_scope: tail:quiet_volume
universe:
  markets: [TWSE, TPEX]
  min_adv_twd: null
  min_adv_pctl: 0.70 # D-143 §五：宇宙 ADV 前 30%，與 A20 的樣本門檻同一把尺（D-151 §十三）
  min_price: 10.0
signals:
  - factor: ml.lgbm_tail_up_20d
    weight: 1.0
    params:
      model_id: lgbm_quietA20_tu_h20_20260430_655df6d7
slots:
  n: 15
  entry_threshold: 0.35 # D-172：模型機率 ≥ 0.35 才是候選；沒人過門檻就空手
  require: # D-174：當天爆量（成交量 ≥ 前 20 日平均 1.5 倍，不含當日）；資料不足＝不買
    - factor: volume.vol_ratio_5d
      min_value: 1.5
      params:
        window: 20
exit_rules:
  - kind: time_stop
    sessions: 20
