# P5（D-092，事前登記）：與 track_g6_ml_flaggate.yaml **逐字相同，只改三處**——
# 名稱、流動性門檻（絕對金額 → 相對前 30%，D-062）、trial_scope。未經部署裁決，勿用於實盤。
# P2／P5b：model_id 與薄因子已改指**長窗口模型**（D-088 sample_tag=lw）；短窗口 pin 不得混用（T-172）。

# G6「ML ＋ 型態進場閘門」
#
# **家族：G 系列（ML 濾網矩陣）。事前登記見 DECISIONS D-072。**
#
# 基準是 L0-new（ML 訊號、20 檔等權、無額外濾網），本格 = 基準 **只加這一個濾網**。
# 故「這個濾網值多少」= 本格 − L0-new，是乾淨的邊際效果。
#
# 加 `price.flag_hold_50d` 為第二訊號＋`require_all_factors`（＝回踩有撐才進場），並改 `fixed_slot`（沒訊號就空手）。這同時是降周轉的機制。
#
# **判讀規則（D-072 事前寫定）**：本批格數多，「最好的那格」幾乎必然是運氣。
# 正確讀法是**每個濾網的邊際效果**，不是挑冠軍。挑冠軍即規格搜尋，DSR 會被稀釋。
#
# 未經部署裁決，勿用於實盤。
name: lw_g6_ml_flaggate
description: G 系列 G6：ML + 型態進場閘門（長窗口 P5 D-092）
trial_scope: lw:long_window_all_ml
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
combine: rank_avg
signals:
- factor: ml.lgbm_lw_net_20d
  weight: 0.5
  params:
    model_id: lgbm_lw_net_h20_20260225_83890036
- factor: price.flag_hold_50d
  weight: 0.5
selection:
  method: top_n
  top_n: 20
weighting: fixed_slot
max_weight_per_stock: 0.05
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
require_all_factors: true
