  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
signals:
  - factor: ml.lgbm_tail_up_20d
    weight: 1.0
    params:
      model_id: lgbm_quietA20_tu_h20_20260430_655df6d7
slots:
  n: 15
  entry_threshold: 0.0
exit_rules:
  - kind: score_below
    factor: ml.lgbm_tail_up_20d
    params:
      model_id: lgbm_quietA20_tu_h20_20260430_655df6d7
      value_col: rank_pct
    threshold: 0.5
