# P1（D-092，事前登記）：與 lw_x1_simple20.yaml **逐字相同，只把 selection 換成 banded_top_n**。
# 門檻 0.90／0.70 抄自 T-076 的 ml_rank_band.yaml（2026-02 為別的目的設的，不是為本批調的）。
# 問的問題：周轉 10× → ≤ 4× 能不能把 7pp 的成本拖累拿回一半。未經部署裁決，勿用於實盤。

# lw_x1_simple20——長窗口（D-087 事前登記）。**判準先寫定，不事後挑。**
#
# 與 `ladder_x1_simple20.yaml` **逐字相同，只換兩件事**：
#   1. 流動性門檻由絕對（`min_adv_twd`）改為相對（`min_adv_pctl: 0.70`，保留 ADV 前 30%）
#      ——D-062 裁決。絕對門檻的留存率有九成八由當年成交熱度解釋（r = +0.982），
#      跨期樣本不可比；相對門檻的標準差由 5.29pp 降到 0.42pp。
#   2. 視窗改為 2017-01-03 ~ 2026-02-28（保險庫邊界不變）。
#
# **與既有 113 筆完全不可比**：引擎現在會收股利（D-085），這裡是含息報酬；
# 而且視窗、宇宙定義都不同。只能與本家族的其他格、以及含息基準比。
#
# 未經部署裁決，勿用於實盤。
name: lw_x1_band
description: X1：= L0，**只**換訊號為四因子，其餘逐字同 L0（20 檔、無營收篩、等權）。階梯是累積的，L3 的改善是在 L1+L2 之上的條件效果；少了這一格，「ML 對比簡單因子本身值多少」無法與檔數／宇宙脫鉤。（診斷用，非部署候選）（帶狀區間降周轉，P1 D-092）
trial_scope: lw:long_window_turnover

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
combine: rank_avg
signals:
  - {factor: fundamental.revenue_yoy, weight: 0.25}
  - {factor: price.mom_60d, weight: 0.25}
  - {factor: fundamental.roe, weight: 0.25}
  - {factor: price.vol_20d, weight: 0.25, params: {window: 60}}
# D-061／R12：`rank_avg` 對**存在的列**求和，缺低波因子的股票拿不到那個負分、
# 分數虛高。四因子配置必須四項齊全才入選。
require_all_factors: true
selection:
  method: banded_top_n
  top_n: 20
  entry_rank_pct: 0.90
  exit_rank_pct: 0.70
weighting: equal
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
max_weight_per_stock: 0.05
