# D-048／T-096：與 ml_rank_repaired.yaml 逐字相同，只換 model_id 到 28 特徵的第二代模型。
# 刻意保留週頻 top-20，不混入 D-046 的頻率變更——讓差異可歸因於特徵集。
#
# T-080 階梯第 3 級：與 configs/strategies/ml_rank.yaml **逐字相同，只換模型 artifact**。
# 換的原因是資料修復（T-079/T-087 修好汙染日、T-082 補回 index_daily、補上 stock_meta），
# 不是策略規格變更——故 trial_scope 維持 ml_rank_h10，依 D-040 不計為新 trial。
# 對照組是 ml_rank.yaml（綁 2f5a21a9，訓練於汙染資料）。
#
# T-069 階梯第 3 級的受測策略：純 ML 排序（SPEC-010 §7）。
# 刻意「純」——只掛 ml.lgbm_rank_10d 一個訊號、不混既有因子、不加 overlay，
# 這樣成本後的淨值差異可完全歸因於 ML 分數本身，而非組合設計。
# 換手率是本級的觀察重點：ML 分數逐日重算、波動高於線性組合，來回成本
# （含 0.3% 證交稅）可能吃掉 IC 優勢；若真如此，解法是分數平滑或 buffer-zone
# 換股規則——但那些參數需另行驗證並計入 DSR trials，不得在此偷改。
name: ml_rank_v2
description: D-048 第二代候選：28 特徵模型（籌碼補齊 + 3 評價因子），策略規格與 ml_rank_repaired 逐字相同（未經部署裁決，勿用於實盤）
trial_scope: ml_rank_h10

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: 30_000_000 # 同既有策略的流動性門檻，確保成本假設可比
  min_price: 10.0

signals:
  - factor: ml.lgbm_rank_10d # direction=1：rank_pct 越高越看多
    weight: 1.0
    params:
      model_id: lgbm_h10_20260225_5526f2c2 # D-048：configs/ml_h10_v2.yaml（28 特徵）

combine: zscore_weighted
selection:
  method: top_n
  top_n: 20 # 同 Sleeve C 規格，便於與既有策略對照
weighting: equal
rebalance:
  schedule: weekly # 標籤視窗 10 交易日 ≈ 兩週；週頻再平衡為其上界
  day: MON
  execution: next_open # 與訓練標籤的 open-to-open 定義一致
overlays: []
max_weight_per_stock: 0.05
