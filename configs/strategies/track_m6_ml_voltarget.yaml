# M6「ML 池 × C1 排序 × 波動率縮放」——三層全上
#
# **家族：M 系列（ML 串接）。事前登記見 DECISIONS D-071，判準先寫定、不事後挑。**
#
# 設計意圖（使用者的話）：「ML 找出來的已經是相對優於大盤了，代表資金應該在裡面，
# 再用因子訊號來判斷進出場點。」——把「資金該在哪個池子」與「何時進出」拆成兩層。
#
# 為什麼這個用法值得測（而不是又一次調參）：ML 的長處是**排序整個橫斷面**
# （OOS RankIC +0.0452，16 個 walk-forward 窗有 15 個為正），短處是**挑不出最強的
# 20 檔**（零成本下對四個公開因子只贏 +1.24pp、月度區塊 t +0.33）。閘門消費的是
# 排序而非尾巴，剛好避開短處。D-066 乙層禁止的是重啟特徵工程與調參；
# 改變投組建構屬「架構」，正是該層明文指定資源該去的方向。
#
# M1 再加 Barroso–Santa-Clara 的波動率縮放 overlay。M6 − M1 量出「風險管理」在 ML 串接上值多少（與 C4 − C1 是同一條邊的對照）。
#
# 未經部署裁決，勿用於實盤。
name: track_m6_ml_voltarget
description: M6：ML 池 × C1 排序 × 波動率縮放
trial_scope: ml_cascade
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: 50000000
  min_price: 10.0
prefilter:
- factor: ml.lgbm_net_20d
  keep_pct: 0.3
  params:
    model_id: lgbm_net_h20_20260225_6a798962
combine: rank_avg
signals:
- factor: price.high_52w
  weight: 0.35
- factor: price.mom_60d
  weight: 0.25
- factor: volume.turnover_z_20d
  weight: 0.25
- factor: price.rs_market_20d
  weight: 0.15
require_all_factors: true
selection:
  method: top_n
  top_n: 20
weighting: equal
max_weight_per_stock: 0.1
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays:
- vol_target_scaling
overlay_params:
  vol_target_scaling:
    target_vol: 0.2
    window: 60
    min_mult: 0.2
