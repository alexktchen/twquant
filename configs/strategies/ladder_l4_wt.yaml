# T-127 控制組階梯（SPEC-013 §3.2，D-060／D-061 事前登記）。
# 判讀規則見 SPEC-013 §3.7：**只填表、不下結論**，且「未能區分」是合法結果。
# trial_scope 不帶 bt: 前綴——`backtest_trial_scope` 會自己加（D-061／R5）。
#
# L4：= L3，唯一變更等權 → 分數加權（p=2）。
# 回答權重貢獻。
# 
name: ladder_l4_wt
description: L4：= L3，唯一變更等權 → 分數加權（p=2）。回答權重貢獻。（診斷用，非部署候選）
trial_scope: ladder_diag

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: 30_000_000
  min_price: 10.0
  # SPEC-013 §3.4 的外部先驗（finlab 公開參數），D-060 禁止調整
  min_revenue_yoy: 0.10
  max_revenue_yoy: 1.50
  min_revenue_streak: 3
combine: rank_avg
signals:
  - {factor: fundamental.revenue_yoy, weight: 0.25}
  - {factor: price.mom_60d, weight: 0.25}
  - {factor: fundamental.roe, weight: 0.25}
  - {factor: price.vol_20d, weight: 0.25, params: {window: 60}}
# D-061／R12：`rank_avg` 對**存在的列**求和，缺低波因子的股票拿不到那個負分、
# 分數虛高。四因子配置必須四項齊全才入選。
require_all_factors: true
selection:
  method: top_n
  top_n: 40
weighting: score_pow
weighting_power: 2.0
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
max_weight_per_stock: 0.05
