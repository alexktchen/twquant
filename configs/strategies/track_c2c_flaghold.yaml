# C2c「旗形有撐」——最嚴格的型態，多數日子會空手
#
# **本方案原本被我判為「不可行」，那個判斷是錯的。** 當時的理由是「每日符合檔數
# 中位只有 0~5，選不滿 20 檔」——但那是把「永遠滿倉」這個假設套到事件策略上。
# 事件策略本來就該在沒訊號時空手：掛零不是缺陷，是正確行為。
#
# 之所以會有那個錯誤判斷，是因為框架當時**表達不出來**：`weighting: equal` 永遠是
# 1/n（不論幾檔都滿倉），而 `cap_and_renormalize` 把總曝險 < 1 當成 bug、
# `n × cap < 1` 時直接 raise。故稀疏事件日不只是「集中」，是會讓回測崩掉。
# 現已新增 `weighting: fixed_slot`：每檔固定 1/top_n，**符合幾檔就投幾檔的資金，
# 其餘留現金**，且截頂後不重分配。
#
# 文獻：Lo, Mamaysky & Wang (2000, JF)「Foundations of Technical Analysis」——
# 用核回歸自動辨識技術型態，證實部分型態帶有增量資訊。
#
# 實測每日符合檔數（抽樣 12 個訊號日，宇宙 ADV≥5000 萬、價≥10）：
#   flag_hold_50d：0 ~ 5 檔（常常掛零）→ 多數調倉日會完全空手
# 故多數日子的曝險會遠低於 100%——**那是設計，不是缺陷**。判讀時要看
# 「有部位的日子表現如何」與「平均曝險多少」，不能只看 CAGR
# （長期低曝險必然壓低 CAGR，那不代表訊號沒用）。
#
# 未經部署裁決，勿用於實盤。
name: track_c2c_flaghold
description: C2c 旗形有撐事件：固定格位，常態空手（Lo-Mamaysky-Wang 2000）
trial_scope: pattern_flaghold

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: 50_000_000
  min_price: 10.0

combine: rank_avg
signals:
  - { factor: price.flag_hold_50d, weight: 0.25 } # ← 事件閘門兼排序項
  - { factor: price.high_52w, weight: 0.30 }
  - { factor: price.mom_60d, weight: 0.25 }
  - { factor: volume.turnover_z_20d, weight: 0.20 }
require_all_factors: true

selection: { method: top_n, top_n: 20 }
# ← 關鍵：符合幾檔就投幾檔的資金，其餘現金
weighting: fixed_slot
max_weight_per_stock: 0.10
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
