# G1「ML ＋ 營收成長濾網」
#
# **家族：G 系列（ML 濾網矩陣）。事前登記見 DECISIONS D-072。**
#
# 基準是 L0-new（ML 訊號、20 檔等權、無額外濾網），本格 = 基準 **只加這一個濾網**。
# 故「這個濾網值多少」= 本格 − L0-new，是乾淨的邊際效果。
#
# 宇宙層加 min_revenue_yoy 0.10、max 1.50、連 3 月（外部先驗，D-060 禁止調整）。階梯的 L2 已顯示這是唯一把 ML 拉起來的濾網（CAGR +10.85%→+14.81%）。
#
# **判讀規則（D-072 事前寫定）**：本批格數多，「最好的那格」幾乎必然是運氣。
# 正確讀法是**每個濾網的邊際效果**，不是挑冠軍。挑冠軍即規格搜尋，DSR 會被稀釋。
#
# 未經部署裁決，勿用於實盤。
name: lw_g1_ml_revenue
description: G 系列 G1：ML + 營收成長濾網（長窗口 P5 D-092）
trial_scope: lw:long_window_all_ml
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
  min_revenue_yoy: 0.1
  max_revenue_yoy: 1.5
  min_revenue_streak: 3
combine: zscore_weighted
signals:
- factor: ml.lgbm_lw_net_20d
  weight: 1.0
  params:
    model_id: lgbm_lw_net_h20_20260225_83890036
selection:
  method: top_n
  top_n: 20
weighting: equal
max_weight_per_stock: 0.05
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
