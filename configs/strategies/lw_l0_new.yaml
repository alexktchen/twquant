# P5（D-092，事前登記）：與 ladder_l0_new.yaml **逐字相同，只改三處**——
# 名稱、流動性門檻（絕對金額 → 相對前 30%，D-062）、trial_scope。未經部署裁決，勿用於實盤。
# P2／P5b：model_id 與薄因子已改指**長窗口模型**（D-088 sample_tag=lw）；短窗口 pin 不得混用（T-172）。

# T-146／D-066：證偽測試的處理組。與 `ml_net_h20_m.yaml` **逐字相同，只換 model_id**
# ——把「換模型」這一個變因單獨隔離出來。
#
# 對照組是 `ladder_x1_simple20.yaml`（四因子、其餘逐字同），依 D-066 事前登記的
# 三層準則機械判定：甲＝繼續投入開發（月度區塊 t ≥ +2.0，或 ΔCAGR ≥ +3pp 且
# ΔMDD 不劣於 −3pp）；乙＝保留但停止開發（t ≥ 0，或 Sharpe 差 ≥ +0.10）；丙＝退場。
# 層級由量測決定，**不得在看到結果後挑一個方便的**。
#
# 模型 lgbm_lw_net_h20_20260225_83890036：乾淨資料重訓，train_end 2026-02-25 與凍結模型
# 相同（保險庫完整），12 特徵／切分／lgbm 參數逐項未動，只加 D-066 明列的兩處資料
# 修正（total_return: true、max_span_sessions: 42）。OOS RankIC +0.0452（汙染版 +0.0363）。
# D-052(乙)／T-110：與 ml_net_h20.yaml **逐字相同，只改 rebalance.schedule 為 monthly**。
#
# 為什麼是這一格：D-052 的診斷指出瓶頸是「毛利 ≈ 來回成本」，而兩個修法單獨都已失敗——
#   目標函數（ml_net_h20 週頻）：top-20 超額 +0.55%／10 日（rank 模型的 7 倍），但周轉 2,768% → 1× Sharpe 0.13
#   降周轉（D-046 rank 月頻）：周轉 879%，但毛利仍是 rank 標籤的 +0.08%／10 日 → 1× Sharpe 0.39
# 組合從未測過：+0.55%／10 日的毛利配上月頻的 5.7pp／年成本（取代週頻的 21pp／年），
# 是唯一「量到的毛利 > 量到的成本」的格子。
#
# 不需重訓：沿用已凍結的 lgbm_lw_net_h20_20260225_83890036。
# trial_scope 用新的 bt:ml_net_h20_turnover，不佔 ml_rank 家族額度。
name: lw_l0_new
description: T-146 證偽測試用：與 ml_net_h20_m **逐字相同，只換成 T-145 重訓的乾淨模型**（未經部署裁決，勿用於實盤）（長窗口 P5 D-092）
trial_scope: lw:long_window_all_ml

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0

signals:
  - factor: ml.lgbm_lw_net_20d
    weight: 1.0
    params:
      model_id: lgbm_lw_net_h20_20260225_83890036

combine: zscore_weighted
selection:
  method: top_n
  top_n: 20
weighting: equal
rebalance:
  schedule: monthly # ← 與 ml_net_h20.yaml 的唯一差異
  day: MON
  execution: next_open
overlays: []
max_weight_per_stock: 0.05
