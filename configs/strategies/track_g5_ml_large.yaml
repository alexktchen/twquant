# G5「ML ＋ 大型股宇宙」
#
# **家族：G 系列（ML 濾網矩陣）。事前登記見 DECISIONS D-072。**
#
# 基準是 L0-new（ML 訊號、20 檔等權、無額外濾網），本格 = 基準 **只加這一個濾網**。
# 故「這個濾網值多少」= 本格 − L0-new，是乾淨的邊際效果。
#
# 只留市值前 100 大。B1／B2 是目前 Sharpe 最高的兩軌，此格檢驗那個優勢是否也能移植到 ML 訊號上。
#
# **判讀規則（D-072 事前寫定）**：本批格數多，「最好的那格」幾乎必然是運氣。
# 正確讀法是**每個濾網的邊際效果**，不是挑冠軍。挑冠軍即規格搜尋，DSR 會被稀釋。
#
# 未經部署裁決，勿用於實盤。
name: track_g5_ml_large
description: G 系列 G5：ML + 大型股宇宙
trial_scope: ml_gate_matrix
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: 100000000
  min_price: 10.0
  mktcap_rank_max: 100
combine: zscore_weighted
signals:
- factor: ml.lgbm_net_20d
  weight: 1.0
  params:
    model_id: lgbm_net_h20_20260225_6a798962
selection:
  method: top_n
  top_n: 20
weighting: equal
max_weight_per_stock: 0.1
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
