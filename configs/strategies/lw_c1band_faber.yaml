# D-095（事前登記）：帶狀降周轉的 C1 ＋ Faber 均線。
# **檢定 D-094 的解釋**：擇時在 C1（周轉 10.1×）上讓回撤惡化 6.1pp，
# 在 B2（5.4×）上改善 14.7pp——解釋是「整批進出對高周轉集中組合是再加一層換手成本」。
# C1band 的周轉是 5.3×，與 B2 同級但選股邏輯與 C1 逐字相同：**若解釋成立，這裡應為正**。
# 與 lw_c1_band.yaml 逐字相同，只多一層 overlay。參數取原著值，不掃。

# P1（D-092，事前登記）：與 lw_c1_breakout.yaml **逐字相同，只把 selection 換成 banded_top_n**。
# 門檻 0.90／0.70 抄自 T-076 的 ml_rank_band.yaml（2026-02 為別的目的設的，不是為本批調的）。
# 問的問題：周轉 10× → ≤ 4× 能不能把 7pp 的成本拖累拿回一半。未經部署裁決，勿用於實盤。

# lw_c1_breakout——長窗口（D-087 事前登記）。**判準先寫定，不事後挑。**
#
# 與 `track_c1_breakout.yaml` **逐字相同，只換兩件事**：
#   1. 流動性門檻由絕對（`min_adv_twd`）改為相對（`min_adv_pctl: 0.70`，保留 ADV 前 30%）
#      ——D-062 裁決。絕對門檻的留存率有九成八由當年成交熱度解釋（r = +0.982），
#      跨期樣本不可比；相對門檻的標準差由 5.29pp 降到 0.42pp。
#   2. 視窗改為 2017-01-03 ~ 2026-02-28（保險庫邊界不變）。
#
# **與既有 113 筆完全不可比**：引擎現在會收股利（D-085），這裡是含息報酬；
# 而且視窗、宇宙定義都不同。只能與本家族的其他格、以及含息基準比。
#
# 未經部署裁決，勿用於實盤。
name: lw_c1band_faber
description: C1 純技術面飆股：52 週高點 × 中期動能 × 異常放量 × 相對強弱（不排大型股、無獲利門檻）（帶狀區間降周轉，P1 D-092）（＋Faber 均線，D-095 檢定格）
trial_scope: lw:turnover_x_timing

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0

combine: rank_avg
signals:
  - { factor: price.high_52w, weight: 0.35 } # George–Hwang 2004：主訊號
  - { factor: price.mom_60d, weight: 0.25 } # Jegadeesh–Titman 1993
  - { factor: volume.turnover_z_20d, weight: 0.25 } # Gervais et al. 2001
  - { factor: price.rs_market_20d, weight: 0.15 }
# 四項不齊全即不入選：rank_avg 對「存在的列」求和，缺項者分數虛高（D-061／R12）
require_all_factors: true

selection:
  method: banded_top_n
  top_n: 20
  entry_rank_pct: 0.90
  exit_rank_pct: 0.70
weighting: equal
max_weight_per_stock: 0.10
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: [index_trend_gate]
overlay_params:
  index_trend_gate:
    index_id: TAIEX
    window: 200
    floor: 0.0
