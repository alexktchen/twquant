# **偏離 D-067 的事前登記，理由寫在這裡**：D-067 寫「沿用已凍結的
# lgbm_net_h20_20260225_9a575e97」，但那是在 T-145 之前寫的——D-064／T-145 已判定
# 該模型訓練在三種汙染上（2023 缺腿、跨缺口標籤、特徵 inf），它的每個數字都不可信。
# 改用 T-145 重訓的乾淨模型 lgbm_net_h20_20260225_6a798962。
#
# 這個改動**讓 D-067 的兩條邊更乾淨而非更髒**：架構那條邊是 B1-ML − L0new
# （兩側同為乾淨模型，只差宇宙與加權）；訊號那條邊是 B1 − B1-ML（兩側同架構，只差訊號）。
# 若沿用汙染模型，架構那條邊會同時混進「模型好壞」這個變因。
# T-147 B1-ML：**與 `track_b1_large_enhanced.yaml` 逐字相同，只把訊號換成 ML**。
#
# 這是 2×2 缺的那一格。現有三格是 L0（ML×等權小型）、X1（四因子×等權小型）、
# B1（四因子×大型市值加權）；沒有 B1-ML，就分不清 B1 的優勢來自**架構**還是**換訊號**。
#
# 為什麼這不是「把模型用在它不會的地方」（已量測，非假設）：
# 模型訓練時大型股只佔樣本約 5%，損失函數幾乎被小型股主導，故「在大型股上還準不準」
# 不能假設。實測 2024-06／2025-03／2026-02 三個日期，ML 分數在市值前 100 大的標準差
# 是 0.2148／0.1968／0.2073，全宇宙是 0.2117／0.1959／0.2109——**離散度幾乎相同**，
# 均值也無系統性偏低（0.409 vs 0.399）。前 100 大在全宇宙分數的五分位分布
# 101/154/88/75/82，散布在整個範圍。模型在大型股裡照樣分得開。
#
# trial_scope 與 B1 分開：它是不同的候選，不得混進同一個家族稀釋 DSR 計數。
name: track_b1ml_large_enhanced
description: B1-ML 大型股增強（ML 訊號）：市值前 100 大選 30 檔、市值加權（未經部署裁決，勿用於實盤）
trial_scope: largecap_enhanced_ml

universe:
  markets: [TWSE, TPEX]
  mktcap_rank_max: 100 # 只在市值前 100 大裡選（T-121）
  min_adv_twd: 30_000_000
  min_price: 10.0

# 訊號＝L0 的凍結模型，與 B1 的唯一差異。不重訓（D-066：本次不調 ML）。
combine: zscore_weighted
signals:
  - factor: ml.lgbm_net_20d
    weight: 1.0
    params:
      model_id: lgbm_net_h20_20260225_6a798962
# 單一訊號故 require_all_factors 無作用；顯式寫出以免日後加因子時忘記（D-061／R12）
require_all_factors: true

selection: {method: top_n, top_n: 30}
weighting: mktcap # T-123；權重用 exp(ln 市值)，不得按 log 值比例、不得套 direction
# §5.4 事前決定，**不得為了改善回測而調整**：0050 的台積電約 57%，設 5% 就結構性
# 做空它、設 57% 則整個策略等於一檔股票。0.25 讓單一權值股吃到 7.5 倍於等權
# （30 檔等權 = 3.33%），又保留至少 4 檔的有效分散度下限。
max_weight_per_stock: 0.25
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
