# D-145 第十輪 **E 臂**：tail_b ＋ 每日曝險目標。**RESEARCH ONLY，未經部署裁決，勿用於實盤。**
#
# 與 tail_b 逐字相同，只多 `slots.exposure_target`——V1 的 vol_target_scaling 只在月頻再平衡路徑
# 生效，每日補位從不呼叫它；T-286 讓 slots 模式也吃同一個倍數：新進場每格 pv×mult/n，
# 現有持股在 positions_value/pv 超過 mult 一格（1/n）以上時等比減碼到 mult。
# 參數逐字沿用 lw_v1_voltgt.yaml，不調。
#
# 每日補位：每天收盤後用右尾模型的機率排序，取前 15 名補到滿手；沒有再平衡日、
# 沒有月底強制換股。進場分數是**絕對機率**（薄因子回 score 而非 rank_pct）。
#
# entry_threshold: 0.0 是刻意的——D-143 §三 登記的是「每日機率前 15 名」，
# **沒有絕對門檻**。設了門檻就變成另一個假設（要另立登記），而且會讓 A／B／D
# 三臂在不同日子持有不同檔數、無法比較。
#
# 出場（D-143 §四 的 ratchet，事前寫死）：初始停損 −15%；浮盈曾達 +20% 後改為
# 自持有期高點回落 10%；60 個交易日時間上限。順序決定成交紀錄裡記哪一條原因。
#
# 成交假設由引擎既有行為滿足：隔日開盤漲停不成交、記 unfilled（engine.py 模組 docstring）。
name: tail_b_voltgt
description: 第十輪 E 臂：tail_b ＋ 每日曝險目標（V1 參數原封不動）
trial_scope: lw:slots_tail
universe:
  markets: [TWSE, TPEX]
  min_adv_twd: null
  min_adv_pctl: 0.70 # D-143 §五：宇宙 ADV 前 30%，與 E0 相同（D-140 已證更嚴格更差）
  min_price: 10.0
signals:
  - factor: ml.lgbm_tail_up_60d
    weight: 1.0
    params:
      model_id: lgbm_tailb_tu_h60_20260430_7ab9b0f9
slots:
  n: 15
  entry_threshold: 0.0
  exposure_target:
    target_vol: 0.16
    window: 60
    min_mult: 0.10
exit_rules:
  - kind: stop_loss
    pct: 0.15
  - kind: trailing_pct
    pct: 0.10
    min_peak_gain: 0.20
  - kind: time_stop
    sessions: 60
