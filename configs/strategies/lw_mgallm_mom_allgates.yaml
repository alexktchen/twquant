# P5（D-092，事前登記）：與 track_mgallm_mom_allgates.yaml **逐字相同，只改三處**——
# 名稱、流動性門檻（絕對金額 → 相對前 30%，D-062）、trial_scope。未經部署裁決，勿用於實盤。

# MGALL-mom「隔離格：全部濾網上，池子改動能」
#
# **家族：MG 系列（M 結構 ＋ G 濾網）。事前登記見 D-073，基座已依 D-076 修正。**
#
# 基座是 **M1**：ML 前 30% 當池子（決定資金在哪）× C1 的四個技術因子在池內排序 × 等權 20 檔。
# 本格 = 基座 **＋五個濾網全上，池子改動能**，故「這個濾網在串接結構上值多少」= 本格 − M1。
#
# **為什麼基座不是 M2**（原本的設計，已作廢）：M2 用 `flag_hold_50d` 當進場閘門，
# 而實測該型態**每日只有 0~5 檔成立、常常掛零**；再被 ML 池砍掉 70% 之後交集幾乎為零，
# M2／M3 實測曝險**都只有 3%**——97% 的時間空手。在兩個幾乎不交易的策略之間比較濾網，
# 量到的是雜訊不是效果。改用 M1 為基座（曝險約 97%，真的在交易）。
#
# **判讀規則**：看邊際效果、不挑冠軍；冠軍格在報告中須標「不得據此下結論」。
#
# 未經部署裁決，勿用於實盤。
# **這格是 MG 家族的判定依據**：MGALL − MGALL-mom 是唯一乾淨的隔離。
name: lw_mgallm_mom_allgates
description: MG 系列 MGALL-mom：**隔離格**，與 MGALL 逐字相同只把池子換成動能（長窗口 P5 D-092）
trial_scope: lw:long_window_all
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
  min_revenue_yoy: 0.1
  max_revenue_yoy: 1.5
  min_revenue_streak: 3
  mktcap_rank_max: 100
prefilter:
- factor: price.mom_60d
  keep_pct: 0.3
  params:
    smooth_days: 10
- factor: price.vol_20d
  keep_pct: 0.5
combine: rank_avg
signals:
- factor: price.high_52w
  weight: 0.35
- factor: price.mom_60d
  weight: 0.25
- factor: volume.turnover_z_20d
  weight: 0.25
- factor: price.rs_market_20d
  weight: 0.15
require_all_factors: true
selection:
  method: top_n
  top_n: 20
weighting: equal
max_weight_per_stock: 0.15
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays:
- vol_target_scaling
overlay_params:
  vol_target_scaling:
    target_vol: 0.2
    window: 60
    min_mult: 0.2
