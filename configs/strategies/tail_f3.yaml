# D-149 第十一輪 F3 臂。**RESEARCH ONLY，不設門檻、只報數字（D-146 規矩）。**
#
# 與 tail_b 唯一的差別：新進場每格 × clip(σ_ref ÷ σ_i, 0.5, 1.0)。σ＝訊號日 price.vol_20d，
# σ_ref＝當晚候選前 15 名的中位數。上限 1.0 沿用 D-004「只降不升」，下限 0.5 沿用 D-009 的
# REDUCED 檔位（configs/risk.yaml reduced_scale）。不減總曝險。
#
# 以下除 name／description／slots 新增段外，逐字同 tail_b.yaml（測試守著）。
name: tail_f3
description: 第十一輪 F3：tail_b ＋ 反波動部位（只降不升、下限 0.5）
trial_scope: lw:slots_tail
universe:
  markets: [TWSE, TPEX]
  min_adv_twd: null
  min_adv_pctl: 0.70 # D-143 §五：宇宙 ADV 前 30%，與 E0 相同（D-140 已證更嚴格更差）
  min_price: 10.0
signals:
  - factor: ml.lgbm_tail_up_60d
    weight: 1.0
    params:
      model_id: lgbm_tailb_tu_h60_20260430_7ab9b0f9
slots:
  n: 15
  entry_threshold: 0.0
  inverse_vol:
    factor: price.vol_20d
    floor: 0.5
exit_rules:
  - kind: stop_loss
    pct: 0.15
  - kind: trailing_pct
    pct: 0.10
    min_peak_gain: 0.20
  - kind: time_stop
    sessions: 60
