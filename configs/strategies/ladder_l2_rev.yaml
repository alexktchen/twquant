# T-127 控制組階梯（SPEC-013 §3.2，D-060／D-061 事前登記）。
# 判讀規則見 SPEC-013 §3.7：**只填表、不下結論**，且「未能區分」是合法結果。
# trial_scope 不帶 bt: 前綴——`backtest_trial_scope` 會自己加（D-061／R5）。
#
# L2：= L1，唯一變更宇宙加營收篩。
# 回答 Q2（宇宙構造值多少）。
# 
name: ladder_l2_rev
description: L2：= L1，唯一變更宇宙加營收篩。回答 Q2（宇宙構造值多少）。（診斷用，非部署候選）
trial_scope: ladder_diag

universe:
  markets: [TWSE, TPEX]
  min_adv_twd: 30_000_000
  min_price: 10.0
  # SPEC-013 §3.4 的外部先驗（finlab 公開參數），D-060 禁止調整
  min_revenue_yoy: 0.10
  max_revenue_yoy: 1.50
  min_revenue_streak: 3
combine: zscore_weighted
signals:
  - factor: ml.lgbm_net_20d
    weight: 1.0
    params:
      model_id: lgbm_net_h20_20260225_9a575e97
selection:
  method: top_n
  top_n: 40
weighting: equal
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays: []
max_weight_per_stock: 0.05
