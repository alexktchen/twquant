# MGALL-mom「隔離格：全部濾網上，但池子用動能」
#
# **家族：MG 系列（M 結構 ＋ G 濾網）。事前登記見 DECISIONS D-073。**
#
# 基座是 **M2**：ML 前 30% 當池子（決定資金在哪）× `flag_hold_50d` 回踩有撐才進場
# （決定何時進）× `fixed_slot`（沒訊號就空手）。本格 = 基座 **＋五個濾網全上，池子改動能**。
# 故「這個濾網在串接結構上值多少」= 本格 − M2，是乾淨的邊際效果。
#
# **判讀規則（事前寫定）**：格數多，最好那格幾乎必然是運氣。看邊際效果、不挑冠軍；
# 冠軍格在報告中須標「不得據此下結論」。
#
# 未經部署裁決，勿用於實盤。
# **這格是整個 MG 家族的判定依據**：MGALL − MGALL-mom 是唯一乾淨的隔離
# ——兩者逐字相同，只差池子是 ML 還是動能。沒有它，MGALL 好看只能說「這套堆疊有用」，
# 說不出「ML 有用」。
name: track_mgallm_mom_allgates
description: MG 系列 MGALL-mom：**隔離格**，與 MGALL 逐字相同只把池子換成動能
trial_scope: ml_cascade_gates
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: 100000000
  min_price: 10.0
  min_revenue_yoy: 0.1
  max_revenue_yoy: 1.5
  min_revenue_streak: 3
  mktcap_rank_max: 100
prefilter:
- factor: price.mom_60d
  keep_pct: 0.3
  params:
    smooth_days: 10
- factor: price.vol_20d
  keep_pct: 0.5
combine: rank_avg
signals:
- factor: price.flag_hold_50d
  weight: 0.3
- factor: price.high_52w
  weight: 0.3
- factor: price.mom_60d
  weight: 0.25
- factor: volume.turnover_z_20d
  weight: 0.15
require_all_factors: true
selection:
  method: top_n
  top_n: 20
weighting: fixed_slot
max_weight_per_stock: 0.1
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays:
- vol_target_scaling
overlay_params:
  vol_target_scaling:
    target_vol: 0.2
    window: 60
    min_mult: 0.2
