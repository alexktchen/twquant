# 名稱、流動性門檻（絕對金額 → 相對前 30%，D-062）、trial_scope。未經部署裁決，勿用於實盤。
# P2／P5b：model_id 與薄因子已改指**長窗口模型**（D-088 sample_tag=lw）；短窗口 pin 不得混用（T-172）。

# MG3「M1 ＋波動率縮放」
#
# **家族：MG 系列（M 結構 ＋ G 濾網）。事前登記見 D-073，基座已依 D-076 修正。**
#
# 基座是 **M1**：ML 前 30% 當池子（決定資金在哪）× C1 的四個技術因子在池內排序 × 等權 20 檔。
# 本格 = 基座 **＋波動率縮放**，故「這個濾網在串接結構上值多少」= 本格 − M1。
#
# **為什麼基座不是 M2**（原本的設計，已作廢）：M2 用 `flag_hold_50d` 當進場閘門，
# 而實測該型態**每日只有 0~5 檔成立、常常掛零**；再被 ML 池砍掉 70% 之後交集幾乎為零，
# M2／M3 實測曝險**都只有 3%**——97% 的時間空手。在兩個幾乎不交易的策略之間比較濾網，
# 量到的是雜訊不是效果。改用 M1 為基座（曝險約 97%，真的在交易）。
#
# **判讀規則**：看邊際效果、不挑冠軍；冠軍格在報告中須標「不得據此下結論」。
#
# 未經部署裁決，勿用於實盤。
name: lw_mg3_voltgt
description: MG 系列 MG3：M1 基座 ＋波動率縮放（長窗口 P5 D-092）
trial_scope: lw:long_window_all_ml
universe:
  markets:
  - TWSE
  - TPEX
  min_adv_twd: null
  min_adv_pctl: 0.70
  min_price: 10.0
prefilter:
- factor: ml.lgbm_lw_net_20d
  keep_pct: 0.3
  params:
    model_id: lgbm_lw_net_h20_20260225_83890036
combine: rank_avg
signals:
- factor: price.high_52w
  weight: 0.35
- factor: price.mom_60d
  weight: 0.25
- factor: volume.turnover_z_20d
  weight: 0.25
- factor: price.rs_market_20d
  weight: 0.15
require_all_factors: true
selection:
  method: top_n
  top_n: 20
weighting: equal
max_weight_per_stock: 0.1
rebalance:
  schedule: monthly
  day: MON
  execution: next_open
overlays:
- vol_target_scaling
overlay_params:
  vol_target_scaling:
    target_vol: 0.2
    window: 60
    min_mult: 0.2
