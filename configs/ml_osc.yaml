# OSC（D-139，**事前登記**）：基準 ml_h20_cost_aware_lw.yaml ＋ 5 支震盪指標。
# 唯一變數是特徵 12 → 17；標籤、切分、LGBM 超參逐字不動，故 IC 差異只能歸因於特徵。
# 基準模型 lgbm_lw_net_h20_20260225_83890036 的 OOS RankIC = +0.0661。
# LW 版（D-088，事前登記）：與 ml_h20_cost_aware.yaml **逐字相同，只多 sample_tag**。
# 唯一的差別在 CLI 的 `--from`：2020-01-01 → 2015-09-01（長窗口）。
#
# 為什麼 2015-09-01：12 個特徵中最晚齊備的是 price.mom_60d（2015-08-26），
# 而行情資料本身回補到 2015-06-01（10% 漲跌幅上路日，見 D-083）。留 4 天餘裕。
#
# **sample_tag 的用途不是註記，是身分**：沒有它的話，本檔與 ml_h20_cost_aware.yaml
# 產出的 model_id 會逐字相同（hash 只看超參數，不看訓練窗口），
# 而 ml_scores 按 model_id 索引——兩個模型的分數會混在同一條線裡。
sample_tag: osc

# T-072 / SPEC-011：唯一預先登記的 H20 成本感知候選。
horizon_days: 20
aux_horizons: [10, 40]
features:
  - fundamental.revenue_accel
  - fundamental.revenue_yoy
  - price.intraday_ret_20d
  - price.mom_20d
  - price.mom_60d
  - price.overnight_ret_20d
  - price.residual_reversal_5d
  - price.reversal_5d
  - price.rs_market_20d
  - price.vol_20d
  - volume.turnover_z_20d
  - volume.vol_ratio_5d
  # D-139：五支震盪指標（D-138）。方向依實測訂（超買為正），
  # 本輪用樣本外 IC 驗證那個選擇是不是事後挑出來的。
  - price.bollinger_pctb_20
  - price.bollinger_width_20
  - price.kd_k_9
  - price.macd_hist_norm
  - price.rsi_14
context_features: []
label:
  execution: next_open
  excess: market_mean
  transform: cost_adjusted_return
  adv_window_sessions: 20
  position_notional_twd: 500_000.0
  downside_penalty: 0.25
  total_return: true # D-054／D-066：含股利。未還原時 6~8 月有 38.2% 樣本換分位
  # T-139／T-144：h=20 × 2 的跨距容忍。橫跨資料缺口的標籤設 null——不設時約 8,673 個
  # 訓練樣本的「20 日報酬」實際橫跨數月，而模型會把它當成真實的極端報酬學進去。
  max_span_sessions: 42
split:
  train_min_years: 2.0
  test_months: 3
  embargo_days: 20
  vault_months: 6
  days_per_year: 244
  days_per_month: 21
lgbm:
  num_leaves: 31
  learning_rate: 0.05
  min_data_in_leaf: 100
  feature_fraction: 0.8
  n_estimators: 400
  seed: 42
refit:
  schedule: monthly
trials_log: research_log
