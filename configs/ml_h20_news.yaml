# 新聞因子試驗（T-415／SPEC-018 §7 H2，事前登記）：與 ml_h20_cost_aware_lw.yaml **逐字相同，只多 26 個 news.* 特徵與 sample_tag**。
# 對照組＝同一份 lw 設定、同 --from／--to、同折同 seed，在同一天重訓。開發期評估只看測試期 ≥ 2023-01 的折；
# 研究 CLI 一律 --to 2026-08-31（D-109 第二保留期）。新聞特徵 2021-01 以前是 null（語料從 2021 開始），LightGBM 原生處理。
sample_tag: lw_news

# T-072 / SPEC-011：唯一預先登記的 H20 成本感知候選。
horizon_days: 20
aux_horizons: [10, 40]
features:
  - fundamental.revenue_accel
  - fundamental.revenue_yoy
  - price.intraday_ret_20d
  - price.mom_20d
  - price.mom_60d
  - price.overnight_ret_20d
  - price.residual_reversal_5d
  - price.reversal_5d
  - price.rs_market_20d
  - price.vol_20d
  - volume.turnover_z_20d
  - volume.vol_ratio_5d
  - news.count_1d
  - news.attention_5d
  - news.attention_20d
  - news.novelty
  - news.sent_1d
  - news.sent_5d
  - news.sent_shift
  - news.sector_heat
  - news.mops_count_5d
  - news.mops_novelty
  - news.topic_01
  - news.topic_02
  - news.topic_03
  - news.topic_04
  - news.topic_05
  - news.topic_06
  - news.topic_07
  - news.topic_08
  - news.topic_09
  - news.topic_10
  - news.topic_11
  - news.topic_12
  - news.topic_13
  - news.topic_14
  - news.topic_15
  - news.topic_16
context_features: []
label:
  execution: next_open
  excess: market_mean
  transform: cost_adjusted_return
  adv_window_sessions: 20
  position_notional_twd: 500_000.0
  downside_penalty: 0.25
  total_return: true # D-054／D-066：含股利。未還原時 6~8 月有 38.2% 樣本換分位
  # T-139／T-144：h=20 × 2 的跨距容忍。橫跨資料缺口的標籤設 null——不設時約 8,673 個
  # 訓練樣本的「20 日報酬」實際橫跨數月，而模型會把它當成真實的極端報酬學進去。
  max_span_sessions: 42
split:
  train_min_years: 2.0
  test_months: 3
  embargo_days: 20
  vault_months: 6
  days_per_year: 244
  days_per_month: 21
lgbm:
  num_leaves: 31
  learning_rate: 0.05
  min_data_in_leaf: 100
  feature_fraction: 0.8
  n_estimators: 400
  seed: 42
refit:
  schedule: monthly
trials_log: research_log
