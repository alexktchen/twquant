# 後端每天要產出目標持股的策略（D-112）。
#
# **這份名單不是「通過的策略」**——D-107 判定沒有任何一支可部署。前 8 支是金庫期實測過的，
# 每一支都帶著它在未見資料上的實際成績，頁面必須把成績跟名單一起顯示。
# 最後一支 TAIL-B 是 D-147 使用者上架的研究策略：**沒有金庫期成績**（vault 留空，頁面會標示），
# 而且它是每日補位型——頁面上是「今天若有空位會買誰」，不是實際持股。
# vault 區塊由 data/vault_verdict.json 程式化產生（D-107 的數字），不是手抄的；要更新請重新產生。
# 金庫期 2026-03-02 ~ 2026-08-31；同期 0050：報酬 +0.3223、最深回撤 -0.1588（價格報酬口徑）。

# T-300：策略持股頁的「連續 N 天」最多往回看幾份快照（約一個月的交易日）。只影響顯示。
tracking_lookback: 20

strategies:
  - code: LW-B2
    config: lw_b2_broad_capw
    label: 全市場多因子（市值加權）
    note: 全市場四因子選股、市值加權；形狀最接近指數。
    vault:
      total_return: 0.257771
      max_drawdown: -0.154052
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-B1
    config: lw_b1_large_enhanced
    label: 大型股增強
    note: 市值前 100 名內選 30 檔、市值加權。
    vault:
      total_return: 0.215104
      max_drawdown: -0.166813
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-M1
    config: lw_m1_ml_c1
    label: ML 訊號進載具
    note: 四因子精選加上長窗口排序模型的分數，20 檔等權。
    vault:
      total_return: 0.226847
      max_drawdown: -0.351217
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-M1-faber
    config: lw_m1_faber
    label: ML 訊號 ＋ 大盤擇時
    note: 同上，外加 200 日均線擇時；金庫期閘門一次都沒關過。
    vault:
      total_return: 0.226847
      max_drawdown: -0.351217
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-C1
    config: lw_c1_breakout
    label: 四因子精選 20 檔
    note: 技術面突破四訊號，20 檔等權；長窗口回撤最深的一支。
    vault:
      total_return: 0.051629
      max_drawdown: -0.427403
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-C1n50
    config: lw_c1_n50
    label: 四因子精選 50 檔
    note: 同上，持股放寬到 50 檔。
    vault:
      total_return: -0.007726
      max_drawdown: -0.364249
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-R2
    config: lw_r2_c1_lvgate
    label: 剔除高波動
    note: 四因子精選，先剔掉波動度最高的一成。
    vault:
      total_return: -0.054570
      max_drawdown: -0.379385
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-F1
    config: lw_f1_revpool
    label: 營收驚奇池 × 技術排序
    note: 先用營收驚奇模型縮池到前 30%，再以技術訊號排序。
    vault:
      total_return: 0.005820
      max_drawdown: -0.417681
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: LW-E0
    config: lw_e0_ctrl
    label: E0 排序模型 15 檔（紙上交易追蹤中）
    note: >-
      八輪加工沒有一輪改善它（D-141 §三）：排序模型＋月頻換股＋完全不出場、15 檔等權。
      自 D-142 起以紙上交易向前累積新資料。**金庫成績不是乾淨的樣本外**——E0 是
      2026-09-19（D-114）才定義的，那時金庫已開封十天，故下面的數字與這條軌要累積的
      前向紀錄不是同一回事。
    vault:
      total_return: 0.353896
      max_drawdown: -0.344966
      benchmark_total_return: 0.322340
      benchmark_max_drawdown: -0.158794
  - code: TAIL-B
    config: tail_b
    label: 右尾飆股（第九輪 B 臂）
    note: >-
      每日補位型：列的是右尾機率前 15 名（今天若有空位會買誰），不是實際持股。
      研究成績 D-143（2017-01~2026-02，walk-forward 樣本外）：命中率倍率 3.01×、年化 +12.8%、
      最大回撤 −39.7%、Calmar 0.32——低於 E0 的 0.67；沒有金庫期成績。
      出場規則（−15% 停損、浮盈 +20% 後回落 10%、60 日）尚未接進「我的追蹤」。
    # 研究期成績（D-147）：來源 data/tracks_tail/tail_b_1x.json（T-168 修正後重跑），
    # 由 `scripts/d143_verdict.py --bundles D:/project/twquant/data/tracks_tail` 印出；
    # 不是金庫期——頁面會標明。
    research:
      decision: D-143 §十一
      window_start: 2017-01-03
      window_end: 2026-02-28
      cagr: 0.128
      max_drawdown: -0.397
      calmar: 0.32
