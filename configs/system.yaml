# 系統配置（權威欄位定義見 SPEC-001）。第一版最小集，後續任務擴充。

data_dir: data

# 各來源限流（滑動窗：per_seconds 內最多 max_requests 次，SPEC-001 §7）
source_rates:
  twse_rwd:
    max_requests: 3
    per_seconds: 5.0
  tpex:
    max_requests: 3
    per_seconds: 5.0
  tdcc:
    max_requests: 3
    per_seconds: 5.0
  mops:
    max_requests: 3
    per_seconds: 5.0
  taifex:
    max_requests: 3
    per_seconds: 5.0
  finmind:
    max_requests: 6
    per_seconds: 1.0
  yahoo:  # 晨報的全球行情（T-377）：9 個代號各一次，不是正式開放的介面，放慢
    max_requests: 2
    per_seconds: 1.0
  tpex_ic:  # 櫃買中心產業價值鏈平台（族群標籤 D-177）：每週一次、47 頁
    max_requests: 1
    per_seconds: 1.0
  fubon:  # 富邦DJ 分點頁（免費公開站；全市場一天 ~1800 檔）
    # D-022：平行回補——限流即並行度上限，backfill-fubon-chip --workers 預設取此值。
    # 6 req/2s（3 req/s）為使用者授權的積極設定，換取全市場單日 ~10 分；被封風險自負。
    max_requests: 6
    per_seconds: 2.0

quality_gate:
  min_rows_ratio: 0.8
  inst_cross_check_tol: 0.005
  disk_min_gb: 50.0
  # D-175：雲端提早到 17:3x 跑，打分前這些表當天都要抓到（上市、上櫃都要）；缺一張就擋下交給下一輪。
  # 融資券（21:00 公布）不列：D-008 以 T-1 進當天訊號，當天的晚上那一輪才抓。
  required_tables:
    - twse/prices_daily
    - twse/institutional_daily
    - twse/stock_valuation
    - tpex/prices_daily
    - tpex/stock_valuation

# T-371／D-187：MOPS 重大訊息主旨 → 直寫 PG（serving.mops_announcements；本機另一張 material_news 是研究用全文快照，不相干），洞悉層的證據包讀它。
# 每天抓當天與前一天（前一天 17:30 以後的公告要隔天的頁才有），再補回看窗內 PG 一列都沒有的日曆日——
# 週末也有公告，所以用日曆日。回看要蓋住證據包讀的 30 天，留幾天緩衝。第一次跑約 36 個請求（mops 限流 3 次／5 秒）。
material_news:
  lookback_days: 35

# T-374／D-188：大盤體檢（首頁戰情室）。成交金額對前 20 個交易日平均；創新高／新低看前 20 個交易日的收盤。
# 只算四碼普通股（同 serving.yaml cloud.stock_pattern）。
market_daily:
  avg_sessions: 20
  high_low_window: 20

# T-375／D-188：期交所盤後統計（三大法人臺股期貨未平倉、選擇權買賣權比）。兩個下載端點都吃區間，
# 每天重抓最近 10 個日曆日（冪等，排程停擺幾天自己補回來）。期交所約 15:00 後陸續更新，available_at 記 15:30。
taifex_daily:
  lookback_days: 10
  available_time: "15:30"

# T-376／D-188：法說會行事曆（MOPS 月表，上市／上櫃）。每天抓當月與下一個月（4 個請求），整月覆蓋。
conferences:
  months_ahead: 1

# T-377／D-188：晨報。台北 06:30 那班（美股 05:00 收、夜盤 05:00 收）抓這些行情，連同昨天的大盤體檢、期交所盤後、
# 族群資金、名單與公告，先用規則寫「今日一句話」，再請模型（configs/llm.yaml tasks.morning_brief）寫三到六點。
# 符號是 Yahoo Finance 的寫法；網站 frontend/functions/_lib/yahoo.ts 的四大指數要與 us_indices 一致（test 守著）。
morning_brief:
  us_indices:
    - {symbol: "^GSPC", name: "S&P 500"}
    - {symbol: "^IXIC", name: "那斯達克"}
    - {symbol: "^DJI", name: "道瓊"}
    - {symbol: "^SOX", name: "費半"}
  extras:
    - {symbol: "^VIX", name: "VIX"}
    - {symbol: "^TNX", name: "美債 10 年殖利率"}
    - {symbol: "TWD=X", name: "美元／台幣"}
    - {symbol: "TSM", name: "台積電 ADR"}
    - {symbol: "DX-Y.NYB", name: "美元指數"}
  adr_symbol: "TSM"
  adr_ratio: 5
  adr_underlying: "2330"
  fx_symbol: "TWD=X"
  news_limit: 8
  top_groups: 3
  line_names: {CORE: 大盤精選, QUIET: 潛伏飆股, QUIETV: 高分爆量}

# T-310：官方每日當沖、借券賣出、處置、注意 → 直寫 PG（D-154 §五、D-157）。每日 pipeline 的「籌碼」步驟用。
chip_daily:
  # 當沖／借券只收四碼普通股——與 FinMind 回補的歷史宇宙同一條（D-154 §二.5），表不在中途換宇宙。
  # 官方表另有 ETF／六碼權證等（證交所當沖約 240 列、櫃買約 120 列），刻意不收。
  universe_pattern: "^[1-9][0-9]{3}$"
  # 每天抓「前第 k 個交易日」並覆寫（upsert）。**當天不抓**：證交所借券 20:30／22:30 才更新（TWT93U 附註）、
  # 當沖「當日晚間」公布，19:00 的排程抓不到；兩表 available_at 都是同日 21:00，隔天 19:00 抓進來仍早於
  # 20:00 訊號截點，訊號看到的日期不變。
  refetch_offsets:
    # 1＝首次抓（存進 daytrade_first_pub，量修訂幅度用）；2＝T+2 定案（官方：最終數額以 T+2 日更新為準）；
    # 3＝保險：官方沒寫 T+2 那次更新幾點出來，19:00 可能還沒有，隔天再抓一次一定是定案值。
    daytrade_daily: [1, 2, 3]
    # 1＝22:30 第二次更新之後（補進隔日轉上市的個股）才是完整版。
    sbl_short_daily: [1]
  # 往回找「某市場一列都沒有」的交易日並補抓（排程停擺幾天後自己補回來，不用人記得）。
  catchup_trading_days: 10
  # T-327：資料湖表也在同一個窗裡補缺日。融資融券證交所常在 19:00 之後才公布，當天那一次抓不到；
  # 隔天的籌碼因子以 T-1 融資進當日訊號，於是整欄空、兩條線的模型都拒絕打分（2026-09-24／29／30 實測）。
  lake_catchup_tables: [margin_daily]
  # 處置／注意公告：查詢窗往回幾個日曆日（漏跑的日子下次補到）。
  alerts_lookback_days: 14
  # 處置依「處置期間」查，當天公告的處置從下一個交易日才開始——迄日不往後推就抓不到當天的公告。
  disposition_lookahead_days: 14
