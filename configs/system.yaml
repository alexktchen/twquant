# 系統配置（權威欄位定義見 SPEC-001）。第一版最小集，後續任務擴充。

data_dir: data

# 各來源限流（滑動窗：per_seconds 內最多 max_requests 次，SPEC-001 §7）
source_rates:
  twse_rwd:
    max_requests: 3
    per_seconds: 5.0
  tpex:
    max_requests: 3
    per_seconds: 5.0
  tdcc:
    max_requests: 3
    per_seconds: 5.0
  mops:
    max_requests: 3
    per_seconds: 5.0
  taifex:
    max_requests: 3
    per_seconds: 5.0
  finmind:
    max_requests: 6
    per_seconds: 1.0
  cnyes:  # 晨報的新聞頭條：一天兩個請求
    max_requests: 2
    per_seconds: 1.0
  cnyes_archive:  # 歷史回補（T-412）：一秒一次，約一萬次、三小時
    max_requests: 1
    per_seconds: 1.0
  yahoo:  # 晨報的全球行情（T-377）：9 個代號各一次，不是正式開放的介面，放慢
    max_requests: 2
    per_seconds: 1.0
  tpex_ic:  # 櫃買中心產業價值鏈平台（族群標籤 D-177）：每週一次、47 頁
    max_requests: 1
    per_seconds: 1.0
  fubon:  # 富邦DJ 分點頁（免費公開站；全市場一天 ~1800 檔）
    # D-022：平行回補——限流即並行度上限，backfill-fubon-chip --workers 預設取此值。
    # 6 req/2s（3 req/s）為使用者授權的積極設定，換取全市場單日 ~10 分；被封風險自負。
    max_requests: 6
    per_seconds: 2.0

quality_gate:
  min_rows_ratio: 0.8
  inst_cross_check_tol: 0.005
  disk_min_gb: 50.0
  # D-175：雲端提早到 17:3x 跑，打分前這些表當天都要抓到（上市、上櫃都要）；缺一張就擋下交給下一輪。
  # 融資券（21:00 公布）不列：D-008 以 T-1 進當天訊號，當天的晚上那一輪才抓。
  required_tables:
    - twse/prices_daily
    - twse/institutional_daily
    - twse/stock_valuation
    - tpex/prices_daily
    - tpex/stock_valuation

# T-371／D-187：MOPS 重大訊息主旨 → 直寫 PG（serving.mops_announcements；本機另一張 material_news 是研究用全文快照，不相干），洞悉層的證據包讀它。
# 每天抓當天與前一天（前一天 17:30 以後的公告要隔天的頁才有），再補回看窗內 PG 一列都沒有的日曆日——
# 週末也有公告，所以用日曆日。回看要蓋住證據包讀的 30 天，留幾天緩衝。第一次跑約 36 個請求（mops 限流 3 次／5 秒）。
material_news:
  lookback_days: 35
  # 說明全文最多存幾個字：2026-10-16 實測一天 204 則、中位數 438 字、最長 3,607 字；超過的（財報類）截斷並註明「全文見觀測站」
  content_max_chars: 4000

# T-374／D-188：大盤體檢（首頁戰情室）。成交金額對前 20 個交易日平均；創新高／新低看前 20 個交易日的收盤。
# 只算四碼普通股（同 serving.yaml cloud.stock_pattern）。
market_daily:
  avg_sessions: 20
  high_low_window: 20

# T-385／D-191 方向 4：權證。條款（證交所 t187ap37_L、櫃買 mopsfin_t187ap37_O，存續中全表）只在條款變了才多存一版；
# 日行情（證交所 MI_INDEX 0999／0999P、櫃買 tpex_warrant_daily_quts）每天一份；每檔標的算一列摘要給網站看。
# 隱含波動：Black-Scholes、無風險利率年化 1.6%（近似台灣一年期定存，數字本身不重要——同一把尺量所有股票）、
# 只看距到期 20～120 天、履約價在標的價 ±15% 內的「一般型」權證，挑最價平那一檔；用最後買賣價中價，沒有就用收盤。
# 摘要只算四碼普通股標的。給人看，不進因子、不進模型。
warrants:
  risk_free_rate: 0.016
  iv_min_days: 20
  iv_max_days: 120
  iv_max_moneyness: 0.15
  stock_pattern: "^[1-9][0-9]{3}$"

# T-375／D-188：期交所盤後統計（三大法人臺股期貨未平倉、選擇權買賣權比）。兩個下載端點都吃區間，
# 每天重抓最近 10 個日曆日（冪等，排程停擺幾天自己補回來）。期交所約 15:00 後陸續更新，available_at 記 15:30。
taifex_daily:
  lookback_days: 10
  available_time: "15:30"

# T-376／D-188：法說會行事曆（MOPS 月表，上市／上櫃）。每天抓當月與下一個月（4 個請求），整月覆蓋。
conferences:
  months_ahead: 1

# T-377／D-188：晨報。台北 06:30 那班（美股 05:00 收、夜盤 05:00 收）抓這些行情，連同昨天的大盤體檢、期交所盤後、
# 族群資金、名單與公告，先用規則寫「今日一句話」，再請模型（configs/llm.yaml tasks.morning_brief）寫三到六點。
# 符號是 Yahoo Finance 的寫法；網站 frontend/functions/_lib/yahoo.ts 的四大指數要與 us_indices 一致（test 守著）。
morning_brief:
  us_indices:
    - {symbol: "^GSPC", name: "S&P 500"}
    - {symbol: "^IXIC", name: "那斯達克"}
    - {symbol: "^DJI", name: "道瓊"}
    - {symbol: "^SOX", name: "費半"}
  extras:
    - {symbol: "^VIX", name: "VIX"}
    - {symbol: "^TNX", name: "美債 10 年殖利率"}
    - {symbol: "TWD=X", name: "美元／台幣"}
    - {symbol: "TSM", name: "台積電 ADR"}
    - {symbol: "DX-Y.NYB", name: "美元指數"}
  adr_symbol: "TSM"
  adr_ratio: 5
  adr_underlying: "2330"
  fx_symbol: "TWD=X"
  news_limit: 8
  top_groups: 3
  # 研判素材的門檻（使用者 2026-10-17：「多一點分析師的角度」）：規則先算出背離與對照，給模型當分析依據
  signal_big_move: 0.02   # 夜盤、費半漲跌超過 2% 才提
  signal_volume_hot: 1.2  # 成交量 ≥ 20 日平均 1.2 倍＝量能放大
  signal_volume_cold: 0.8 # ≤ 0.8 倍＝量能萎縮
  signal_streak: 5        # 外資連買／連賣 5 天以上才提
  # 昨晚國際金融大事與新聞頭條（使用者 2026-10-17）：鉅亨網新聞列表，取前一天 14:00（台股收盤後）到晨報當下的新聞
  news_feeds:
    - {category: headline, label: 頭條}
    - {category: wd_stock, label: 國際股}
  news_since_hour: 14
  # 晨報接新聞（使用者 2026-10-20 選「晨報接新聞」）：新聞服務裡同一段時間被至少 3 家不同媒體報的事（同一家的兩個頻道算一家），
  # 最多 5 件當事實句；新聞庫連線放 .env／GitHub 祕密 TWQUANT_NEWS_DSN，沒設就只有鉅亨網頭條
  events_min_outlets: 3
  events_limit: 5
  news_dsn_env: TWQUANT_NEWS_DSN
  # 盤後快訊（2026-10-19，使用者：「這邊台灣晚上時間也要跑一次」）：取今天 09:00（開盤）起到快訊當下的新聞
  evening_news_since_hour: 9
  # 2026-10-20 使用者：「不要 21:45，換 17:45」、同日再改 18:00——每日 pipeline（17:33 開始、約 20 分鐘）有時 18:00 還沒寫好今天的大盤體檢，
  # 所以先等：每 60 秒查一次 market_daily 有沒有今天那列，最多 60 分鐘；等不到（休市、pipeline 壞了）就不出，印原因。
  evening_wait_minutes: 60
  evening_poll_seconds: 60
  news_fetch_limit: 30
  headline_limit: 8
  # 頭條只有標題，數字檢查抓不到方向寫反（2026-10-17 實見：「美債殖利率急跌」被寫成「急升」）：
  # 這些標的在頭條與晨報裡的方向（後面 4 個字內第一個升／漲／跌／降…）相反 → 那句丟掉
  news_direction_subjects: [殖利率, 油價, 金價, 銀價, 美元, 日圓, 新台幣, 比特幣, 美股, 費半, 那斯達克, 道瓊, 標普, 台股]
  news_direction_window: 4
  # 今天的操作方向（T-396，使用者 2026-10-18：「首頁的今日一句話也是要有推薦的方向」）：立場三選一＋一句操作方向；
  # 存成第一點【方向】（不改表）。數字照樣核對，不准喊點位或保證。
  stances: [偏多, 中性, 偏空]
  strategy_chars: 60
  # 立場與持股水位要一致：偏多不准寫「持股降低」、偏空不准寫「持股提高」
  stance_conflicts: {偏多: [持股降低], 偏空: [持股提高]}
  forbidden_terms: [目標價, 保證, 穩賺, 必漲, 必跌, 上看, 下看, 點位, 包你]
  line_names: {CORE: 大盤精選, QUIET: 潛伏飆股, QUIETV: 高分爆量}

# T-393／D-195：每日名單每檔一句話（使用者 2026-10-18：「每日名單裡面的個股也用 LLM 給一句話」）。
# 只顯示、不改名單、不進模型。模型只看規則先寫好的事實句；輸出的數字要出自事實、狀態詞（處置、法說會…）要出自事實，
# 不准寫買賣建議；對不上就改用規則句（網站不標 AI）。
pick_blurbs:
  lines: [CORE, QUIET, QUIETV]   # 寫哪幾條線
  max_chars: 45                  # 一句話最多幾個字（含標點）；超過改用規則句
  max_numbers: 2                 # 一句話最多幾個數字（10/22 這種日期算一個；近 60 日、52 週這種期間不算）；超過改用規則句
  near_high: 0.05                # 離 52 週高點還差這麼多（小數）以內，多給一條「在 52 週高點附近」的事實（模型才能寫「貼近一年高點」）
  max_tokens: 2400               # 一條線一次呼叫（最多 15 檔）的輸出上限
  move_days: 5                   # 「近 5 日漲跌」：收盤對 5 個交易日前收盤
  drop_alert: 0.05               # 近 5 日跌超過這個（小數）算「提醒」，否則只是行情
  ahead_days: 10                 # 往後看幾天的除權息、法說會、處置（同網站 risks.ts RISK_AHEAD_DAYS）
  announcement_days: 7           # 近幾天的重大訊息主旨
  announcement_max: 3            # 最多引用幾則公告
  announcement_chars: 40         # 公告主旨截到幾個字
  insider_days: 30               # 近幾天的內部人申報轉讓（同網站 insider.ts）
  common_share: 0.6              # 一條線裡幾成以上的檔都有的加分理由，不給模型（每句都一樣等於沒說）
  # 一句話裡出現就必須也出現在事實句的狀態詞（防止模型自己編「處置」「連買」）
  # 第二行是 2026-10-18 實測模型自己編過的（52 週高點寫成「歷史高點」、沒根據寫「股價反轉」）
  state_terms: [買超, 賣超, 新高, 新低, 漲停, 跌停, 處置, 注意股, 除息, 除權, 內部人, 轉讓, 易跌, 私募, 減資, 增資, 自結, 營收, 新上榜,
                歷史, 反轉, 突破, 轉強, 轉弱, 利多, 利空, 主力, 外資, 投信, 自營商, 融券]
  # 白話說法 → 事實裡必須有的字（2026-10-18 實測：模型把提示詞例子「股價貼近一年高點」抄到沒有這條事實的股票）
  # 值是「事實裡有其中一個就算有根據」
  evidence_terms: {一年高點: [52 週高點], 高點: [高點], 量能: [成交量], 爆量: [成交量], 量增: [成交量],
                   波動: [波, 振幅, 跳動], 股性: [波, 振幅], 振幅: [振幅, 波], 本益比: [本益比], 市值: [市值],
                   融資: [融資], 殖利率: [殖利率], 產業: [產業], 漲勢: [漲], 跌勢: [跌], 跌幅: [跌], 走跌: [跌],
                   貼近: [附近], 接近: [附近], 逼近: [附近],  # 「離高點還差 59%」被寫成「貼近一年高點」（10/15 實測）
                   法說會: [法說會, 法人說明會], 連買: [連續買超], 連賣: [連續賣超], 跌破: [之下, 新低], 站穩: [之上], 站上: [之上]}  # 簡稱對應事實的寫法（10/18 實測誤殺）
  # 一般投資人看不懂的術語：出現就整句不用（提示詞已要求翻成白話）
  jargon_terms: [全市場前, 全市前, 標準差, 真實波幅, 布林通道, garman]
  # 一句話裡出現就整句不用（只陳述、不給建議）
  # 第二行是預測或暗示漲跌（2026-10-18 實測：「股價距離一年高點仍有空間」）
  advice_terms: [建議, 買進, 賣出, 加碼, 減碼, 停損, 停利, 目標價, 布局, 進場, 出場,
                 空間, 可期, 看好, 看壞, 看漲, 看跌, 有望, 可望, 潛力, 補漲, 機會]

# T-394／D-196：名單四面向評分與 AI 首選（使用者 2026-10-18：「每檔依照消息、技術、籌碼、基本四個面向來評分…兩個模型給我一檔最推薦的」）。
# 模型只照規則寫好的事實打 1～5 分、每個面向寫一句分析師觀點、一句綜合結論（含建議）與立場、挑首選；
# 核對沿用 pick_blurbs 的詞表，但**可以給建議**（使用者同日：「你要對四個觀點給分析師角度的投資建議」，D-196 §二）。
# **沒有驗證過能預測報酬**，事後檢驗見 D-196。
pick_review:
  lines: [CORE, QUIET]          # 兩條正式線（D-163）；高分爆量多數日子很少或沒有
  # 一檔一次呼叫（同日實測：一條線 15 檔一次寫，模型開始套模板、編數字、串錯面向）；首選另外一次
  max_tokens: 1400              # 一檔：四句觀點、一段結論（T-428 加長）
  top_max_tokens: 300           # 首選：代號＋一句理由
  view_chars: 50                # 每個面向的觀點最多幾個字（T-428：30 → 50，要有判斷也要有根據；提示詞寫 40，留緩衝）
  # 綜合結論（T-428，使用者 2026-10-21：「ai給的評語要多一點，四個面向都要評到，更精銳一點」）：
  # 一段，四個面向都要講到（每個面向至少出現 conclusion_dims 裡一個詞）、至少引用 conclusion_min_numbers 個事實裡的數字。
  # 名單列只顯示前兩行（第一句是判斷），個股頁顯示全文。
  conclusion_chars: 150
  conclusion_min_numbers: 2
  conclusion_retries: 1          # 結論沒過 → 告訴模型哪裡沒過、重寫一次（10-21 試跑：qwen3 約一半會漏掉消息面）
  conclusion_dims:
    消息: [消息, 公告, 注意股, 處置, 法說, 除息, 除權, 內部人]
    技術: [技術, 均線, 高點, 新高, 新低, 量能, 成交量, 漲, 跌, 波動]
    籌碼: [籌碼, 外資, 投信, 自營商, 主力, 融資, 大戶]
    基本: [基本面, 營收, 本益比, 股價淨值比, 殖利率, 獲利, 虧損]
  # 立場由程式依四面向總分（0～40、20＝中性）定，五級（使用者 2026-10-21：「只有偏多、中性、偏空，太籠統了」，D-206 §六）；
  # 由高到低，總分 ≥ min 就是那一級。AI 不選立場，照著寫結論。
  stance_levels:
    - {min: 27, label: 強烈偏多}
    - {min: 23, label: 偏多}
    - {min: 18, label: 中性}
    - {min: 14, label: 偏空}
    - {min: 0, label: 強烈偏空}
  # 「多空分歧」：任一面向 ≥ split_hi 且另一面向 ≤ split_lo（例：技術 8、籌碼 3）
  split_hi: 7
  split_lo: 3
  # 可以給建議，但不准保證或喊價（數字還是要出自事實）
  forbidden_terms: [目標價, 保證, 穩賺, 必漲, 必跌, 翻倍, 飆到, 上看, 下看, 包你]
  # 觀點與結論是分析師的解讀，這些詞放行（一句話 T-393 照樣擋）；其他狀態詞（新高、反轉、外資…）照樣要有事實
  interpretive_terms: [轉強, 轉弱, 利多, 利空]
  conclusion_allow: [反轉, 跌破, 站穩]  # 結論裡「宜等待反轉訊號」「跌破 20 日均線則減碼」「若站穩均線」是條件建議不是主張；觀點裡照樣擋
  # 一個面向的觀點不准談別的面向（實測：消息觀點寫「無重大消息，技術面偏多」）
  dim_words: {消息: [消息面], 技術: [技術面, 技術], 籌碼: [籌碼], 基本: [基本面]}
  reason_chars: 60              # 首選理由最多幾個字
  top_total_slack: 2            # 首選的四面向總分要在全名單最高總分的幾分以內（10/15 實測模型挑了自己打 11 分、最高 18 分的那檔）
  history_days: 400             # 行情往回抓幾個日曆日（52 週高點要約 250 個交易日）
  move_days: [5, 20, 60]        # 技術面：近幾日漲跌
  ma_days: [20, 60]             # 技術面：均線
  high_days: 250                # 52 週高點＝近 250 個交易日最高收盤
  low_days: 20                  # 「20 日新低」
  volume_days: 20               # 成交量對前幾日平均
  chip_days: 5                  # 籌碼面：法人與融資看近幾日
  chip_long_days: 20            # 外資另看近 20 日
  streak_min: 2                 # 法人連買／連賣幾天以上才寫
  holders_level: 15             # 集保分級第 15 級＝千張以上（同網站 holders.ts BIG_LEVEL）
  holders_lookback_days: 21     # 千張大戶往回找幾天的週快照（要兩週才算變化）
  revenue_months: 3             # 基本面：最近幾個月的營收年增
  # T-426／D-206 §二：四面向各 5 個小項，偏多 +1／中性 0／偏空 −1，從 base 起算（0～10，5＝中性）。
  # **描述現況，不是預測**；改門檻要在 D-206 記日期與理由，不因為某檔分數看起來不對就調。
  rules:
    base: 5
    stock_pattern: "^[1-9][0-9]{3}$" # 「全市場」＝當天有值的四碼普通股
    hi_pct: 0.8                   # 全市場百分位 ≥ 0.8 偏多、≤ 0.2 偏空（波動反過來：最穩的偏多）
    lo_pct: 0.2
    ma_days: [5, 20, 60]          # 技術・均線：三條都站上 +1、都在下面 −1
    mom_days: 20                  # 技術・漲幅
    vol_days: 20                  # 技術・波動：近 20 日日報酬標準差
    near_high: 0.05               # 技術・高低點：離 52 週高點 5% 以內（或創新高）+1；創 20 日新低 −1
    volume_burst: 1.5             # 技術・量價：量 ≥ 前 20 日平均 1.5 倍，漲 +1、跌 −1
    flow_days: 5                  # 籌碼・外資／主力：近 5 日淨買 ÷ 近 5 日成交量
    trust_streak: 3               # 籌碼・投信：連買／連賣 3 天以上
    margin_jump: 0.03             # 籌碼・融資：減少且上漲 +1；增加 ≥ 3% 且下跌 −1
    holders_pp: 0.5               # 籌碼・千張大戶：比前一週 ±0.5 個百分點
    rev_hot: 0.2                  # 基本・月營收：年增 ≥ 20% +1、年減 ≥ 10% −1
    rev_cold: 0.1
    rev_trend_months: 3           # 基本・營收趨勢：連 3 個月年增 +1／年減 −1
    cheap: 0.7                    # 基本・本益比／股價淨值比：≤ 同產業中位數 × 0.7 便宜、≥ × 1.5 偏貴
    dear: 1.5
    min_peers: 5                  # 同產業少於 5 檔有值 → 不比（資料不足）
    good_news: [庫藏股, 買回]       # 消息・重大訊息主旨關鍵字
    bad_news: [虧損, 違約, 跳票, 重整, 停工, 退票, 下市]  # 不放「減資」：現金減資退錢不是利空

# T-310：官方每日當沖、借券賣出、處置、注意 → 直寫 PG（D-154 §五、D-157）。每日 pipeline 的「籌碼」步驟用。
chip_daily:
  # 當沖／借券只收四碼普通股——與 FinMind 回補的歷史宇宙同一條（D-154 §二.5），表不在中途換宇宙。
  # 官方表另有 ETF／六碼權證等（證交所當沖約 240 列、櫃買約 120 列），刻意不收。
  universe_pattern: "^[1-9][0-9]{3}$"
  # 每天抓「前第 k 個交易日」並覆寫（upsert）。**當天不抓**：證交所借券 20:30／22:30 才更新（TWT93U 附註）、
  # 當沖「當日晚間」公布，19:00 的排程抓不到；兩表 available_at 都是同日 21:00，隔天 19:00 抓進來仍早於
  # 20:00 訊號截點，訊號看到的日期不變。
  refetch_offsets:
    # 1＝首次抓（存進 daytrade_first_pub，量修訂幅度用）；2＝T+2 定案（官方：最終數額以 T+2 日更新為準）；
    # 3＝保險：官方沒寫 T+2 那次更新幾點出來，19:00 可能還沒有，隔天再抓一次一定是定案值。
    daytrade_daily: [1, 2, 3]
    # 1＝22:30 第二次更新之後（補進隔日轉上市的個股）才是完整版。
    sbl_short_daily: [1]
  # 往回找「某市場一列都沒有」的交易日並補抓（排程停擺幾天後自己補回來，不用人記得）。
  catchup_trading_days: 10
  # T-327：資料湖表也在同一個窗裡補缺日。融資融券證交所常在 19:00 之後才公布，當天那一次抓不到；
  # 隔天的籌碼因子以 T-1 融資進當日訊號，於是整欄空、兩條線的模型都拒絕打分（2026-09-24／29／30 實測）。
  lake_catchup_tables: [margin_daily]
  # 處置／注意公告：查詢窗往回幾個日曆日（漏跑的日子下次補到）。
  alerts_lookback_days: 14
  # 處置依「處置期間」查，當天公告的處置從下一個交易日才開始——迄日不往後推就抓不到當天的公告。
  disposition_lookahead_days: 14
