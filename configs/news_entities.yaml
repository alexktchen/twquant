# T-402／D-200：新聞會提到的美股、國外公司、主題（SPEC-017 §6）。台股與族群不寫在這裡，由主庫
# serving.stock_meta／stock_group 同步（scripts/news_sync_entities.py）。
# 別名比對規則（news-service/src/mention.ts）：
#   - 含中文的別名：子字串比對，長的先比、命中的範圍不再給短的用（「美超微」吃掉後「超微」不會再命中）。
#   - 拉丁別名：大小寫要一樣、前後要字界；全大寫 2～5 字當 ticker；其他拉丁別名至少 mention.latin_min 字元。
#   - label 也算別名；configs/news.yaml 的 mention.stopwords 整條不建索引。
# 寫別名的原則：只放新聞標題真的會出現的寫法；容易撞到普通字的不放（全大寫 ticker 是英文單字的如 NOW、COST、
# TER、ON 不放；「日產」會撞到「日產量」所以寫「日產汽車」；「通用」「現代」「福斯」「聯想」都太常見）。
# 主題的別名不要跟主庫族群名一模一樣（族群名本身就是別名，重複會讓同一個字命中兩個實體）：
# 「人工智慧」「伺服器」「散熱」「鋼鐵」交給族群，主題用「AI」「AI伺服器」「液冷」「鋼價」。
# tests/test_news_entities.py 核對：id／ticker 唯一、別名長度、沒有一條別名指到兩個實體。
# 2026-10-19 AI 依公開資訊草擬，族群名照主庫 2026-10-19 的 stock_group。

