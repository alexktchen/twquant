# 台股的英文名（T-402 補；2026-10-20）：國外新聞的原文、以及譯文留著英文的公司名（例「AUO、Largan Micro LED 論戰」）
# 別名比對只認主庫中文股名，這些新聞就連不到台股。scripts/news_sync_entities.py 同步時把這裡的英文名加進該檔的別名。
# key＝主庫 serving.stock_meta 的股名（同步時對不到或對到兩檔就停下來，不用打代號、不會打錯）；值＝英文別名。
# 寫法原則（別名比對是大小寫要一樣、前後要字界，見 news-service/src/mention.ts）：
#   - 只放新聞真的會寫的名字；交易所的「英文簡稱」多半是縮寫（TCC、EMC、CSC），會撞到別的東西，不照抄。
#   - 一個字就是普通英文或別家公司的，寫全名：Delta → Delta Electronics（Delta 是達美航空）、Giant → Giant Manufacturing、
#     Quanta → Quanta Computer、Evergreen → Evergreen Marine、Catcher → Catcher Technology、Chroma → Chroma ATE。
#   - 縮寫只留新聞慣用、又不撞的：TSMC、AUO、UMC、KYEC、GUC。
#   - 台微體（TLC-KY）新聞庫的實體表沒有（主庫沒有這個股名），先不列。
#   - 跟 configs/news_entities.yaml 的美股、國外公司、主題別名不能重複（tests/test_news_tw_en.py 核對）。
