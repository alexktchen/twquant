# T-080：在 T-079 修復後的資料上重跑 Phase 1 H10，**只改資料、不改規格**。
#
# 為什麼要 pin 特徵而不沿用 configs/ml.yaml 的 `features: []`：
# 空清單＝「全部註冊因子」，而評價因子（T-010）上線後註冊數由 25 變 28。
# 直接重訓會同時改動「資料修復」與「特徵集」兩個變數，結果無法歸因
# ——那正是 Phase 2 的錯誤（標籤與特徵同時改，見 D-042）。
# 故此處逐一列出 lgbm_h10_20260225_2f5a21a9 訓練時的 25 個特徵。
#
# 註：其中 price.rs_market_20d 當時因 index_daily 未進 PG 而全為 null（T-082），
# 本次會有真實值。那是**資料修復**不是規格變更，故仍計入本次比較。
# 加入評價因子屬**新候選**，須另行事前登記，不在本任務範圍。

# ML 排序層配置（SPEC-010 §1 權威欄位；MlConfig extra="forbid"）。
# 訓練資料源＝完整歷史 PG（本機還原/歸檔庫），Supabase 滾動窗口禁作訓練源（SPEC-010 §0）。
horizon_days: 10 # 主標籤視窗（交易日）；證交稅 0.3% 決定頻率下限（研究藍圖 §4）
aux_horizons: [5, 20] # 對照視窗（僅評估）
features: # T-080：明確列出，見檔首說明
    - chip.foreign_net_10d
    - chip.foreign_streak
    - chip.inst_net_10d
    - chip.margin_velocity_5d
    - chip.short_margin_ratio
    - chip.trust_net_10d
    - chip.trust_streak
    - fundamental.revenue_accel
    - fundamental.revenue_yoy
    - price.box_breakout_60d
    - price.double_bottom_120d
    - price.flag_hold_50d
    - price.high_52w
    - price.hs_top_120d
    - price.intraday_ret_20d
    - price.mom_1d
    - price.mom_20d
    - price.mom_60d
    - price.overnight_ret_20d
    - price.residual_reversal_5d
    - price.reversal_5d
    - price.rs_market_20d
    - price.vol_20d
    - volume.turnover_z_20d
    - volume.vol_ratio_5d
context_features: [] # Phase 2 再開：market_cap_bucket/board/industry/near_limit/range_20d
label:
  execution: next_open # 報酬起點 t+1 開盤（與策略 execution: next_open 對齊）
  excess: market_mean # 超額化基準＝同日宇宙均值
  transform: rank_pct # 當日橫斷面百分位（漲跌停截斷肥尾在 rank 下免疫）
split:
  train_min_years: 2.0 # 首窗最短年數；T-065 審計定案（訓練期 2020~ 今 6.5 年，SPEC-010 §2）
  test_months: 3
  embargo_days: 10 # 須 ≥ horizon_days（MlConfig 驗證）
  vault_months: 6 # 金庫期：最後 N 個月凍結，僅最終定案時評估一次
  days_per_year: 244 # 台股年交易日近似（年/月→交易日換算基數）
  days_per_month: 21
lgbm: # 只暴露這幾個；決定性旗標（deterministic 等）由 train.py 固定注入
  num_leaves: 31
  learning_rate: 0.05
  min_data_in_leaf: 100
  feature_fraction: 0.8
  n_estimators: 400
  seed: 42
refit:
  schedule: monthly
trials_log: research_log # 實驗登記落點（T-013 research_log；trials 計數供 DSR）
