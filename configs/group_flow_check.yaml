# D-178（2026-10-14，使用者：「驗證族群資金流入到底有沒有用……照專案規矩，要先寫好判斷門檻再看結果」）。
# **事前登記：本檔寫於任何「族群資金流入 × 名單報酬」數字之前，看到結果之後不得修改。**
# 要換定義或門檻＝另開新的登記（新的 D 編號、新的檔），不是改這份。tests/test_group_flow_check.py 守著數值與指紋。
#
# 問題：名單的逐筆裡，進名單那天所屬族群「資金流入」（D-177 修訂：資金倍數 ≥ 1.5、六成以上上漲、至少 3 檔）的那些，
# 之後的報酬是不是比其他逐筆好？好到值得考慮當選股濾網？
#
# 樣本：名單績效逐筆（D-176，每一檔新進名單一筆、隔天開盤買、抱 20 個交易日、扣成本含股利、同一檔同時只有一筆），
# start 以後進名單、已賣出的，三條線合併（即時與事後補都算：模型都在 5/4 前訓練好，是樣本外）。
# 族群：族群表（stock_group，跑的那天的版本），沒有的用官方產業別——與網站相同。
#
# 結論三選一：
#   樣本不足：資金流入組 < min_hot_trades 筆、或來自 < min_hot_dates 個不同日子、或其他組 < min_hot_trades 筆 → 不下結論。
#   有用（開發期支持）：以下全過——
#     ① 平均報酬差（資金流入 − 其他）≥ min_diff；
#     ② 整天一起抽的 bootstrap，ci_level 信賴區間下限 > 0；
#     ③ 資金流入組至少 consistency_min_trades 筆的每一條線，各自的差也 > 0。
#   沒有用：樣本夠、但上面任一條沒過。
# 「有用」也不會直接變成濾網：下一步是把「只買資金流入族群」或「資金流入族群優先」登記成第二保留期（2027-03）的新臂，
# 用還沒發生的資料判讀。「沒有用」照實記錄，族群資金只留在網站上當觀察。
# 次要（全市場資金流入族群 vs 其他，之後 market_horizon 日收盤報酬）只當參考，不影響結論。

