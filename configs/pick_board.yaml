# 每日選股看板（D-163／D-164）：只留兩條線，每天呈現新增、剔除、目前持股與下一個交易日的計畫。
#
# 持股不是帳戶資料，是回測引擎從 replay_start 一路重播到今天的結果（同一套成交語意）。
# replay_start 比顯示窗早約兩個月當暖機：起跑那天空手，大盤精選要等第一次月換股、潛伏飆股要等位子補滿；
# 觀察名單另要顯示窗之前 watch_lookback_sessions 個交易日的前 15 名（不夠會 raise）。
# **頁面不顯示任何報酬**：2026-09-09 起是第二保留期（D-109），只列名單與持有天數。
replay_start: 2026-05-01
display_sessions: 63 # 約三個月的交易日
initial_capital: 10000000 # 1,000 萬、零股——與第十三～十五輪的散戶組相同（D-153 §一 補充二）
lot_size: 1
max_participation: 0.05
watch_lookback_sessions: 20 # 觀察名單的「新名字」＝過去 20 個交易日沒進過前 15 名（同 scripts/a20_picks.py）
html_window_sessions: 6 # HTML 版（T-329）推薦名單的「近 N 日上榜」：看最後幾個交易日的前 15 名

strategies:
  - code: CORE
    name: 大盤精選
    config: lw_e0_ctrl
    summary: 全市場排序模型每月挑 15 檔、平均分配，抱到下個月換股；不設停損停利。
    watch: true # D-165：每天列出「若今天換股會挑的 15 檔」
    # T-330：HTML 版「研究回測參考」引用的結果包（相對 data_dir）。數字從包裡的 metrics 讀，不寫在這裡。
    references:
      - label: 開發期回測（8,000 萬、整張）
        path: tracks_e_long_nodiv/E0_lw_e0_ctrl_1x.json
      - label: 金庫期（模型沒看過的半年；8,000 萬、整張）
        path: tracks_e_vault_nodiv/E0_lw_e0_ctrl_1x.json
  - code: QUIET
    name: 潛伏飆股
    config: quiet_s0
    summary: 在「安靜又買得到」的股票裡，挑 20 天內最可能漲 20% 的股票；15 個位子，每檔抱滿 20 個交易日就賣。
    watch: true
    references:
      - label: 第十三輪長窗口回測（1,000 萬、零股）
        path: tracks_round13/quiet_s0_10m_lot1.json
      - label: D-162 事後檢驗（模型重訓到 2026-02、考 2026-03～09；1,000 萬、零股）
        path: tracks_d162/quiet_s0_2602.json
  # D-174（2026-10-11，使用者：「好，上線變第三條」）：驗證中，2027-03 在第二保留期判讀；判讀前規則不得修改。
  - code: QUIETV
    name: 高分爆量（驗證中）
    config: quiet_p35v
    allow_empty: true # 大多數日子沒有符合的股票；每日名單寫 0 檔，不是錯誤
    summary: 潛伏飆股裡模型分數 0.35 以上、而且當天爆量（成交量是前 20 天平均的 1.5 倍以上）才買；每檔抱滿 20 個交易日。大多數日子不會有符合的股票，崩盤後的反彈期會一次出現很多。驗證中，2027 年 3 月用新資料檢驗前只供觀察。
    watch: true
    references:
      - label: 開發期回測（1,000 萬、零股；只當參考，開發期已用過）
        path: tracks_d172/quiet_p35v_10m_lot1.json
  # D-215（2026-10-23，使用者：「幫我寫成一個策略上架」）：群組「帶量突破前高」的做法做成第四條線；上線觀察，2027-03 判讀前規則不得修改。
  - code: BREAKOUT
    name: 帶量突破
    config: breakout_v20
    allow_empty: true # 兩個條件都要齊，大跌日通常一檔都沒有；每日名單寫 0 檔，不是錯誤
    summary: 收盤站上前 60 個交易日最高價（高出 0.5% 以上）、而且當天成交量是前 20 天平均的 2 倍以上，量比高的排前面、最多 15 檔；每檔抱滿 20 個交易日。沒有模型分數，是把群組每天人工掃圖的那一步自動化，給你挑；2027 年 3 月用新資料檢驗前只供觀察。
    watch: true
    references:
      - label: 開發期參考回測（1,000 萬、零股、2017-10～2026-04；規則登記後才跑，只當參考）
        path: tracks_d215/breakout_v20_10m_lot1.json
