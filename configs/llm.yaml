# 洞悉層 LLM 設定（SPEC-008 §3 / MODEL-POLICY）。程式碼不得寫死模型字串，一律查此檔。
usd_twd: 32.0                 # 匯率，估成本用
daily_budget_twd: 300.0       # 日累計成本上限，超過當日停用洞悉層 + WARN

models:
  opus:  {id: claude-opus-4-8, input_usd_per_1m: 5.0, output_usd_per_1m: 25.0}
  haiku: {id: claude-haiku-4-5, input_usd_per_1m: 1.0, output_usd_per_1m: 5.0}

# 任務→模型路由（SPEC-008 §2）
tasks:
  daily_brief: haiku          # 便宜快、格式固定
  advisor: opus               # 策略調整提案，最強推理
  explainer: opus             # 異常解釋，錯誤成本高
