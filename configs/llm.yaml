# 洞悉層 LLM 設定（SPEC-008 §3 / MODEL-POLICY / D-185）。程式碼不得寫死模型字串，一律查此檔。
usd_twd: 32.0                 # 匯率，估成本用
daily_budget_twd: 300.0       # 日累計成本上限，超過當日停用洞悉層 + WARN
# Cloudflare Workers AI 免費額度每日 10,000 Neurons（UTC 00:00 重置）。D-200 §五 靜態分配：新聞服務的翻譯 2,500
# （configs/news.yaml translate.daily_neurons，自己記帳）、這裡 Python 各任務合計 6,500、留 1,000 緩衝（原 D-185 §4 是 9,000）。
daily_neuron_budget: 6500
request_timeout_s: 120        # REST backend 單次請求逾時（秒）

models:
  # provider 預設 anthropic；cloudflare 模型必須給每百萬 token 的 Neurons（Cloudflare 定價頁），缺了載入即 raise
  opus:  {id: claude-opus-5, input_usd_per_1m: 5.0, output_usd_per_1m: 25.0}
  haiku: {id: claude-haiku-4-5, input_usd_per_1m: 1.0, output_usd_per_1m: 5.0}
  # 試跑模型（D-185 §2）：USD 是公布的超額單價，免費額度內實收 0。
  # system_suffix（D-187）：qwen3 的 /no_think 關掉推理；2026-10-17 實測輸出 token 約剩三分之一、8/8 通過結構驗證。
  # 推理開著時每檔約 31 Neurons、偶爾把 max_tokens 用光而回空內容。
  cf_qwen3: {id: "@cf/qwen/qwen3-30b-a3b-fp8", provider: cloudflare,
             input_usd_per_1m: 0.051, output_usd_per_1m: 0.335,
             input_neurons_per_1m: 4625, output_neurons_per_1m: 30475,
             system_suffix: " /no_think"}

# 任務→模型路由（SPEC-008 §2；D-185 §3 試跑期間 pipeline 兩個任務走 Cloudflare）
tasks:
  daily_brief: cf_qwen3       # 便宜快、格式固定
  advisor: opus               # 策略調整提案，最強推理（沒排程、錯誤成本高，留 Claude）
  explainer: opus             # 異常解釋，錯誤成本高
  morning_brief: cf_qwen3     # 06:30 晨報（T-377／D-188）；一天一次、約 3k 進 400 出
  pick_review: cf_qwen3        # 名單四面向評分、觀點、結論（一檔一次，約 1.3k 進 300 出）與首選（一條線一次，約 4k 進 80 出）（T-394／D-196）
  pick_blurb: cf_qwen3         # 名單每檔一句話（T-393／D-195）；一條線一次呼叫，約 2.5k 進 800 出
  candidate_analysis: cf_qwen3  # 每日候選證據分析；N=30／晚（D-081b）。D-081a 的 opus 路由由 D-185 暫改
