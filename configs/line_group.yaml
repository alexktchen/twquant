# LINE 群組每日圖卡（T-423／D-204）：用一支備用 LINE 帳號（linejs，非官方客戶端協定，同 lt-foods/new_erp）在一般群組的
# **聊天**發一張圖卡（Flex 訊息，點圖打開網站）。⚠ 違反 LINE 使用條款、帳號可能被停權——只能用備用帳號。
# 登入憑證存雲端 web.line_account（refresh token 會輪替，要能寫回）；要發哪些群組在網站「LINE 群組」分頁勾（web.line_groups）。

web_schema: web # 排隊、帳號、群組、圖卡的表放這個 schema（與 serving 分開：重灌、修剪都不碰）；測試用別的 schema
site_url: https://twquant.pages.dev/
card_url_base: https://twquant.pages.dev/pub/line-card/ # 圖卡的公開網址（LINE 伺服器要抓得到；/pub 不經 Cloudflare Access）
# Flex 訊息走 LIFF 分享。空＝用 linejs 內建的 LIFF app（別人的）；建議在 LINE Developers 建自己的 LIFF app（scope chat_message.write）填這裡
liff_id: ""
# 先在記事本發一篇（圖＋摘要＋網址），再用 LINE 的「分享貼文」卡片分享到聊天（使用者 2026-10-22）；群組的記事本在群組上，
# 社群的記事本在整個社群上（同一個社群的主聊天、子聊天共用一篇）。記事本不通才走下面的 Flex／圖片／文字
via_note: true
note_jpeg_quality: 90 # 記事本的圖一律以 JPEG 上傳（linejs 宣告 image/jpeg，宣告錯的 MIME 會被退）
post_gap_seconds: 20 # 每筆之間等幾秒：同帳號連發十幾篇記事本會被 LINE 擋（code=701，new_erp 實測）
max_posts_per_run: 20 # 一次轉接器最多送幾筆（× post_gap_seconds 要遠小於 adapter_timeout_seconds），多的下一輪接著送
fallback_image: true # 圖卡（Flex）發不出去時直接發那張圖（一般圖片訊息：看得到，點了只是放大），後面再發一行網址
image_caption: 看完整內容： # 圖片後面那行網址前的字
fallback_text: true # 圖片也發不出去時改發一則「摘要＋網址」的文字
cta: 點圖看完整內容 › # 圖卡底部那行
footer: 僅供參考，不是投資建議；名單與研判都是程式產生的。

node_bin: node
adapter: line-poster/src/cli.mjs # Node 轉接器（相對 repo 根目錄），要先 `npm ci --prefix line-poster`
adapter_timeout_seconds: 600 # 一次 send／groups 最多跑多久
login_timeout_seconds: 240 # 掃 QR＋輸入 PIN（轉接器自己 180 秒放棄）
lease_seconds: 900 # 發文時占住帳號多久：兩個排程同時跑時不要一起發（也不要一起換 token）；要大於 adapter_timeout_seconds
lock_wait_seconds: 900 # 帳號被另一班占著時最多等多久，等不到就留給下一班
poll_seconds: 15 # 等帳號空出來時多久看一次
# LINE 叫我們慢一點（被暫時限制／701 請稍後再發；new_erp 實測停 10 或 2 分鐘）時，同一步裡最多等多久再試；超過就留給下一班
max_backoff_wait_seconds: 660
max_attempts: 3 # 一則失敗（不是 LINE 叫停的那種）幾次就放棄、標失敗
card_keep_days: 60 # 圖卡留幾天（群組裡的舊訊息還會連到它；一張約 50 KB）

picks_rows_per_line: 5 # 名單圖每條線列前幾名，其餘寫「…另 N 檔」（使用者 2026-10-21 選「三欄名單卡」）
# 族群資金圖的門檻與最多寫幾個族群沿用 configs/push.yaml 的 group_min_picks／group_max_listed（跟網頁推播同一套條件）

card:
  width: 1040 # LINE 建議的圖寬
  palette_colors: 96 # PNG 調色盤顏色數（越少檔案越小，字邊緣越粗糙）
  fonts_regular: # 照順序用第一個存在的
    - { path: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc, index: 3 } # GitHub Actions：apt fonts-noto-cjk，3＝繁中
    - { path: "C:/Windows/Fonts/msjh.ttc", index: 0 } # Windows 微軟正黑體
    - { path: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc, index: 0 }
  fonts_bold:
    - { path: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc, index: 3 }
    - { path: "C:/Windows/Fonts/msjhbd.ttc", index: 0 }
    - { path: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc, index: 0 }
  colors: # 同 frontend/src/cloud/cloud.css
    bg: "#0e0f14"
    panel: "#15161c"
    rule: "#23252d"
    text: "#e6e7eb"
    muted: "#8a8f98"
    accent: "#ff7a00"
    badge_text: "#0e0f14"

# 四種（使用者 2026-10-21 全選、都做成圖）。stale_hours：排進來多久還送不出去（LINE 叫停、帳號掉線）就作廢，
# 晚了才到的「今日名單」「盤前晨報」沒有意義。link：點圖打開哪一頁。
kinds:
  picks: # 每日名單：daily-pipeline 寫好名單後（17:33 主跑、21:13 補跑）
    enabled: true
    stale_hours: 15 # 17:33 排進來 → 隔天 08:33 前
    link: https://twquant.pages.dev/?tab=picks
  groups: # 族群資金流入：同 notify-groups 的條件
    enabled: true
    stale_hours: 15
    link: https://twquant.pages.dev/?tab=group
  morning: # 盤前晨報：morning-brief 06:30
    enabled: true
    stale_hours: 2.5 # 開盤前要送到
    link: https://twquant.pages.dev/
  evening: # 盤後快訊：morning-brief --edition evening 18:00
    enabled: true
    stale_hours: 12 # 隔天 06:00 前（之後就是新的晨報）
    link: https://twquant.pages.dev/
