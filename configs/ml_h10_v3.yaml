# D-050／T-105：第三代候選 = ml_h10_v2 的 28 特徵 + 依 R1–R4 規則自動納入的財報品質因子。
# 本檔由 scratchpad/select_v3_features.py 機械產生，不得手改特徵清單。
# 納入：fundamental.sue, fundamental.roe
# 規則：OOS h=10 |t| >= 3.0、RankIC 符號與 direction 一致、與既有特徵 |rho| <= 0.7。
# 其餘欄位與 ml_h10_v2.yaml 逐字相同（只加特徵、不減、不調參）。

horizon_days: 10
aux_horizons:
- 5
- 20
features:
- chip.foreign_net_10d
- chip.foreign_streak
- chip.inst_net_10d
- chip.margin_velocity_5d
- chip.short_margin_ratio
- chip.trust_net_10d
- chip.trust_streak
- fundamental.revenue_accel
- fundamental.revenue_yoy
- price.box_breakout_60d
- price.double_bottom_120d
- price.flag_hold_50d
- price.high_52w
- price.hs_top_120d
- price.intraday_ret_20d
- price.mom_1d
- price.mom_20d
- price.mom_60d
- price.overnight_ret_20d
- price.residual_reversal_5d
- price.reversal_5d
- price.rs_market_20d
- price.vol_20d
- volume.turnover_z_20d
- volume.vol_ratio_5d
- fundamental.earnings_yield
- fundamental.book_yield
- fundamental.dividend_yield
- fundamental.sue
- fundamental.roe
context_features: []
label:
  execution: next_open
  excess: market_mean
  transform: rank_pct
  total_return: false # D-054：凍結模型的原始配方＝未含股利；新配置一律 true
split:
  train_min_years: 2.0
  test_months: 3
  embargo_days: 10
  vault_months: 6
  days_per_year: 244
  days_per_month: 21
lgbm:
  num_leaves: 31
  learning_rate: 0.05
  min_data_in_leaf: 100
  feature_fraction: 0.8
  n_estimators: 400
  seed: 42
refit:
  schedule: monthly
trials_log: research_log
