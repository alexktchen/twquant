# 名單績效（D-176，事前登記：規則寫死，之後不改）。網站「績效」分頁讀這裡算出來的結果。
#
# 每條線（configs/pick_board.yaml 的 strategies）各開一個虛擬帳戶，完全照公布的每日名單（PG daily_picks）
# 操作，不重算模型、不讓人挑：大盤精選每月換股 15 檔平均分配；潛伏飆股 15 個位子空出來就補、抱滿 20 個
# 交易日就賣；高分爆量有符合才買、抱 20 個交易日。成交語意與回測引擎相同（隔天開盤、零股、成本、漲跌停）。
# 逐筆統計：每一檔新進名單算一筆，隔天開盤買、抱 hold_sessions 個交易日後隔天開盤賣，不受位子限制；
# 同一檔還抱著時又進名單，不重複買、不另算一筆（D-176 修訂二，同坊間回測：同一檔同時只有一個部位）。
start: 2026-05-04 # 第一份每日名單；兩個模型的訓練資料都在這天之前截止（排序 2026-02-25、潛伏飆股 2026-04-30）
initial_capital: 10000000 # 1,000 萬、零股——與每日選股看板相同（pick_board.yaml）
lot_size: 1
max_participation: 0.05
warmup_days: 60 # 開戶日前多讀的行情（日曆日）：前收與 20 日成交額中位數要用
benchmark: "0050" # 同期買進 0050 抱著（含息）；網站顯示（D-176 修訂三）。雲端缺的行情、除權息由 twquant benchmark-fill 補
live_cutoff: "09:00" # 名單在下一個交易日開盤前寫進資料庫＝即時公布；之後才寫的＝事後補
hold_sessions: 20
big_loss: -0.15 # 逐筆「虧超過 15%」的比例
