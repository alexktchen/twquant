# 網頁推播（T-348）：每個交易日雲端排程寫好名單後，發一則「今日名單已更新」給開了通知的裝置。
# 私密金鑰只在環境變數（.env／GitHub secret），這裡只放公開的那半與名稱。

vapid_public_key: BCj5A9F92nMUJyViSXzW6_Z64i26W_fvID4SiyAtgzGzKhiwYpqUinQE4-uRRKZ8jfB-Cc6e9_7rWVUSYyJ8onc # 與 frontend/src/cloud/push.ts 的 VAPID_PUBLIC_KEY 相同（tests/test_push_notify.py 守著）
vapid_private_key_env: TWQUANT_VAPID_PRIVATE_KEY # 存私密金鑰的環境變數名稱
vapid_subject: https://twquant.pages.dev # 推播服務出問題時聯絡誰（規格要 mailto: 或 https:，用網站網址免得公開 email）
site_url: https://twquant.pages.dev/ # 點通知打開哪裡
request_timeout_seconds: 15 # 單一推播服務請求的逾時
ttl_seconds: 43200 # 手機關機時推播服務最多替我們留 12 小時；隔天才收到的「今日名單」沒有意義
# 只接受這些推播服務的網址（瀏覽器給的訂閱網址）：避免有人登記任意網址，讓排程替他打請求。
# 與 frontend/functions/_lib/push.ts 的 PUSH_HOSTS 相同（測試守著）。
allowed_hosts:
  - web.push.apple.com
  - fcm.googleapis.com
  - updates.push.services.mozilla.com
  - notify.windows.com

# 族群資金推播（T-354／D-177 修訂二；門檻寫於看到任何推播結果之前）：當天名單（三條線合起來、同一檔只算一次）裡，
# 同一個族群至少 group_min_picks 檔，而且這個族群當天標了「資金流入」（門檻見 configs/stock_groups.yaml flow）→ 發一則。
group_min_picks: 2
group_max_listed: 3

# 名單相關的兩種通知（今日名單、族群資金）只發給這些帳號（T-429／D-207，使用者 2026-10-22：每日名單與績效只給 admin）。
# 與 frontend/functions/_lib/roles.ts 的 admin 角色相同（tests/test_push_notify.py 守著）；其他帳號開了通知也收不到這兩種。
list_recipients:
  - cktalex@gmail.com
