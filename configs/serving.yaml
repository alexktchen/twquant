# 供應層配置（權威欄位定義見 SPEC-009 §1）。PG 是 Parquet 湖的衍生讀取快取，
# 僅供儀表板展示、可隨時 rebuild、禁回饋因子計算。
# DSN 本體只在 .env（黃金規則 9）；此處只存環境變數名。

enabled: true             # 總開關；true 時 API 讀 PG（不可達即 503，見 D-035）
dsn_env: TWQUANT_PG_DSN   # 存 DSN 的環境變數名稱（DSN 本體在 .env）
pg_schema: serving        # PG schema 名（欄位名避開 pydantic BaseModel.schema 遮蔽）
pool_min: 1               # 連線池下限
pool_max: 8               # 連線池上限
factor_history_days: 1100 # factor_values 保留窗（≈3 年）；超出裁剪
# D-035：無 DuckDB 降級——雲端無資料湖，PG 不可用即 503（不假裝有資料，黃金規則 5）

# D-020：綜合分（composite_daily）只納入的實證有效子集（非全因子等權）。
# 依 T-038 樣本外驗證（docs/research/COMPOSITE-IC-D020.md）：短反轉＋產業殘差反轉＋
# 月營收 YoY 兩 horizon 樣本外皆過 D-006 promote（t≥3）。體檢卡仍展示全部因子，
# 僅綜合分用此子集。改動此清單後需以受影響日期重物化 composite_daily：
#   python -m twquant serving materialize --from <起> --to <迄>   （單日用 --date）
# 注意：`serving rebuild` 只重灌鏡射表，不含因子表；對 composite_daily 下 rebuild 會 raise。
# 地端物化略過（T-277）。這三支的隔日沖判定是 expanding 統計，每天都要掃 broker_trades
# 全部 5,770 萬列：實測單日 > 10 分鐘，而且**歷來一列都沒寫成功**（factor_values 裡是 0 列），
# 卻佔掉整條每日 pipeline 的時間——2026-09-21／09-22 因此整天沒有因子、模型分數與選股名單。
# 等 T-271 的整批路徑做好再移除這三行。
exclude_factors:
  - chip.broker_concentration_20d
  - chip.broker_count_diff_5d
  - chip.broker_persistence_10d
  # D-147：右尾模型的薄因子強制要求 model_id（A／B 兩臂前綴相近），用預設參數每天物化只會 raise；
  # 它的分數本來就在 ml_scores，策略直接讀那裡。
  - ml.lgbm_tail_up_60d
  # T-327：同一個理由——第十二輪的 20 日右尾因子與隨機池因子也強制要求 model_id，每天物化只留一段堆疊。
  - ml.lgbm_tail_up_20d
  - ml.pool_random
  # （T-327）第十二輪的五支盤整型態因子原本排除在這裡（D-151 §十.3「模型要上線時再移除」）。
  # 潛伏飆股（D-163／D-164）上線時漏了移除：長歷史物化只到 09-24，之後每天打分都因特徵整欄空而失敗。
composite_factors:
  - price.reversal_5d
  - price.residual_reversal_5d
  - fundamental.revenue_yoy

# ── 雲端（D-030：Supabase Free 滾動窗口，T-055）─────────────────────────────
# 本機部署不受影響；只有 seed-cloud / prune / GHA pipeline 讀這段。
cloud:
  dsn_env: TWQUANT_SUPABASE_DSN   # Supabase transaction pooler（6543）DSN 的環境變數
  stock_pattern: "^[1-9][0-9]{3}$" # 大表只留四碼普通股（同 screener 宇宙）
  pattern_tables: [prices_daily, broker_trades, shareholding_dispersion]  # 集保週快照全市場 3,350 檔，雲端只留四碼普通股（T-386）
  # 特別股不是四碼卻有產業別、會進產業平均；修剪時留下，否則產業相對因子和地端不同（2026-10-09 實測）
  industry_member_tables: [prices_daily]
  # 名單績效（D-176）的對照「同期買 0050 抱著」要它的行情；0050 不是四碼普通股，修剪時明確留下
  keep_stocks: ["0050", "00981A"] # 00981A：名單績效的第二個對照（D-176 修訂四）
  # 2026-10-09 使用者裁決：Free 不升級；雲端只放「每天算因子 → 模型推薦 → 記錄每日名單」需要的，
  # 空間允許再放 K 線。網站不再有回測、選股池、分點面板。初始切片見 configs/cloud_seed.yaml。
  windows:                         # 滾動窗（交易日數）；未列出的表全史保留（小表）
    prices_daily: 500              # 因子硬下限 260（price.high_52w，test_cloud 把關）；500 日兼作約兩年 K 線
    broker_trades: 3               # 當日聚合、Drive 歸檔，與主力買賣超（T-425：隔日沖事件要前一交易日的明細）；三支分點因子雲端不算
    fubon_fetch_log: 10
    factor_values: 2               # 模型只讀當日因子；網站不再顯示因子走勢
    news_features: 30              # T-414：模型只讀當日；雲端其實不算（步驟略過），留窗給未來同步
    composite_daily: 2
    screener_daily: 5              # 選股池不上雲（它要 166 天分點明細，雲端本來就算不對）
    broker_flow_daily: 5
    main_force_daily: 10           # 主力淨買超（T-425／D-206）：名單評分看近 5 日；broker_daytrade_events 不修剪（一天最多約 840 列）
    ml_scores: 5                   # 只供當日推薦；每日名單另存（待辦）
    factor_cross_stats: 5
    institutional_daily: 80        # chip.foreign_streak 等讀取下界約 63 個交易日
    margin_daily: 80
    stock_valuation: 30            # 估值因子讀取下界約 1 個月
    daytrade_daily: 5              # 籌碼步驟只回補最近幾日；目前沒有因子讀它
    sbl_short_daily: 5
    attention_stocks: 5
    disposition_stocks: 5
    group_flow_daily: 60           # 族群資金（D-177 修訂）：網站只看最新一天，留三個月左右
    mops_announcements: 25              # 重大訊息（T-371）：證據包讀近 30 個日曆日，約 22 個交易日；一天約 300 則、只存主旨
    pick_reviews: 250              # 四面向評分與首選（T-394）：D-196 事後檢驗要累積 60 個交易日＋抱 20 天，留一年
    pick_blurbs: 60                # 名單一句話（T-393）：一天約 33 列；網站看舊名單時沒有一句話＝不顯示
    insight_packs: 60              # 洞悉證據包副本（T-373）：網站個股頁讀最近幾份；30 檔／日 × 約 5 KB
    warrant_daily: 2               # 權證日行情（T-385）：摘要當天算完就用不到；一天約 4.8 萬列
    warrant_summary_daily: 60      # 權證摘要（T-385）：網站個股頁看近幾天；一天約 600 列
    shareholding_dispersion: 9     # 集保千張大戶（T-386）：**週**快照，窗口數＝週數；個股頁看 8 週走勢＋1 週算變化。四碼 2,950 檔 × 15 級 ≈ 4.4 萬列／週
  exclude_factors:                 # 雲端不算（見 CloudConfig 註解）
    - chip.broker_concentration_20d  # T-016：需 broker_trades 全歷史（隔日沖分點 expanding 比率）＋20 日窗 > 雲端 10 日
    - chip.broker_count_diff_5d
    - chip.broker_persistence_10d
  # `pipeline --cloud` 略過的步驟（D-170：網站只要每日推薦＋每日名單＋K 線）。名稱對不上就 raise。
  # 洞悉分析自 T-373 起雲端照跑（Cloudflare Workers AI 免費額度，證據包副本進 insight_packs）。
  skip_pipeline_steps:
    - 訊號生成        # 範例策略 sample_revenue_trust，與兩條線無關
    - 選股池快照      # 要 166 天分點明細，雲端只留 1 天，算出來是錯的
    - 紙上交易        # 帳本是檔案，runner 每次都是新機器，留不住
    - 每日選股看板    # 回測重播（2026-05-01 起），網站不再需要
    - ETF 單位數      # SPEC-016 資金流研究只在地端（D-170：雲端只放推薦需要的資料）
    - ETF 持股        # 同上
    - 月營收          # workflow 在 pipeline 之前已抓上個月與當月（daily-pipeline.yml），不重複打 MOPS
    - 新聞語料拉回    # T-412：歷史語料只在地端 PG（news_hist）；雲端 runner 的主庫不放
    - 新聞因子特徵    # T-414：同上，特徵從地端 news_hist 算
