# 供應層配置（權威欄位定義見 SPEC-009 §1）。PG 是 Parquet 湖的衍生讀取快取，
# 僅供儀表板展示、可隨時 rebuild、禁回饋因子計算。
# DSN 本體只在 .env（黃金規則 9）；此處只存環境變數名。

enabled: true             # 總開關；true 時 API 讀 PG（不可達即 503，見 D-035）
dsn_env: TWQUANT_PG_DSN   # 存 DSN 的環境變數名稱（DSN 本體在 .env）
pg_schema: serving        # PG schema 名（欄位名避開 pydantic BaseModel.schema 遮蔽）
pool_min: 1               # 連線池下限
pool_max: 8               # 連線池上限
factor_history_days: 1100 # factor_values 保留窗（≈3 年）；超出裁剪
# D-035：無 DuckDB 降級——雲端無資料湖，PG 不可用即 503（不假裝有資料，黃金規則 5）

# D-020：綜合分（composite_daily）只納入的實證有效子集（非全因子等權）。
# 依 T-038 樣本外驗證（docs/research/COMPOSITE-IC-D020.md）：短反轉＋產業殘差反轉＋
# 月營收 YoY 兩 horizon 樣本外皆過 D-006 promote（t≥3）。體檢卡仍展示全部因子，
# 僅綜合分用此子集。改動此清單後需以受影響日期重物化 composite_daily：
#   python -m twquant serving materialize --from <起> --to <迄>   （單日用 --date）
# 注意：`serving rebuild` 只重灌鏡射表，不含因子表；對 composite_daily 下 rebuild 會 raise。
# 地端物化略過（T-277）。這三支的隔日沖判定是 expanding 統計，每天都要掃 broker_trades
# 全部 5,770 萬列：實測單日 > 10 分鐘，而且**歷來一列都沒寫成功**（factor_values 裡是 0 列），
# 卻佔掉整條每日 pipeline 的時間——2026-09-21／09-22 因此整天沒有因子、模型分數與選股名單。
# 等 T-271 的整批路徑做好再移除這三行。
exclude_factors:
  - chip.broker_concentration_20d
  - chip.broker_count_diff_5d
  - chip.broker_persistence_10d
  # D-147：右尾模型的薄因子強制要求 model_id（A／B 兩臂前綴相近），用預設參數每天物化只會 raise；
  # 它的分數本來就在 ml_scores，策略直接讀那裡。
  - ml.lgbm_tail_up_60d
  # T-327：同一個理由——第十二輪的 20 日右尾因子與隨機池因子也強制要求 model_id，每天物化只留一段堆疊。
  - ml.lgbm_tail_up_20d
  - ml.pool_random
  # （T-327）第十二輪的五支盤整型態因子原本排除在這裡（D-151 §十.3「模型要上線時再移除」）。
  # 潛伏飆股（D-163／D-164）上線時漏了移除：長歷史物化只到 09-24，之後每天打分都因特徵整欄空而失敗。
composite_factors:
  - price.reversal_5d
  - price.residual_reversal_5d
  - fundamental.revenue_yoy

# ── 雲端（D-030：Supabase Free 滾動窗口，T-055）─────────────────────────────
# 本機部署不受影響；只有 seed-cloud / prune / GHA pipeline 讀這段。
cloud:
  dsn_env: TWQUANT_SUPABASE_DSN   # Supabase transaction pooler（6543）DSN 的環境變數
  stock_pattern: "^[1-9][0-9]{3}$" # 大表只留四碼普通股（同 screener 宇宙）
  pattern_tables: [prices_daily, broker_trades]
  windows:                         # 滾動窗（交易日數）；未列出的表全史保留（小表）
    prices_daily: 260              # 硬下限＝price.high_52w 回看 260（test_cloud 把關）
    broker_trades: 10              # 明細只留近 10 日（歷史在 Drive 歸檔）
    fubon_fetch_log: 10
    factor_values: 20               # D-034 過渡：60 日實測 361 MB 撐爆 Free 500 MB，暫縮 20
    composite_daily: 120            # D-034 過渡：250 → 120（P8 趨勢縮短，待裁決長期方案）
    screener_daily: 250
    broker_flow_daily: 250         # 券商母公司日聚合（P6 折線的雲端資料源）
    ml_scores: 250                 # ML 排序分數（SPEC-010 §5；~2k 列/日，量小）
  exclude_factors:                 # 雲端不算（見 CloudConfig 註解）
    - chip.broker_concentration_20d  # T-016：需 broker_trades 全歷史（隔日沖分點 expanding 比率）＋20 日窗 > 雲端 10 日
    - chip.broker_count_diff_5d
    - chip.broker_persistence_10d
