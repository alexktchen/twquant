# 歷史同區間參考（D-179，事前登記：定義寫死，之後不改；要改＝另開登記）。
# 名單上每一檔：過去「分數落在同一個區間」的股票，照名單規則買進抱 20 個交易日的報酬分布。
# 本機 `scripts/score_reference.py` 算一次，寫 serving.score_reference；網站每檔依分數對到區間顯示。只供觀察，不進模型。
registration: D-179
dev_end: 2026-08-31 # 開發期上界（D-109）：賣出日不得晚於這天、行情只讀到這天；第二保留期 2026-09-09 起一律不碰
warmup_days: 60 # 起日前多讀的行情（日曆日）：前收與 20 日成交額中位數要用（同 scorecard.yaml）

# 一筆怎麼算：同網站績效的逐筆（D-176 §二）
hold_sessions: 20
notional: 666666.67 # 每筆金額＝1,000 萬 ÷ 15
lot_size: 1
max_participation: 0.05
big_loss: -0.15 # 「虧超過 15%」的比例
min_n: 30 # 筆數少於這個數標「樣本少」

# 潛伏模型分數的區間，左閉右開 [lo, hi)
buckets:
  - { key: "<0.25", lo: 0.0, hi: 0.25 }
  - { key: "0.25-0.30", lo: 0.25, hi: 0.30 }
  - { key: "0.30-0.35", lo: 0.30, hi: 0.35 }
  - { key: "0.35-0.40", lo: 0.35, hi: 0.40 }
  - { key: "0.40-0.50", lo: 0.40, hi: 0.50 }
  - { key: ">=0.50", lo: 0.50, hi: 1.0001 } # 分數是機率，上界含 1.0

periods:
  dev: 開發期（規則在這段資料上試出來的，只當參考）
  unseen: 模型沒看過的期間

lines:
  CORE: # 大盤精選：名單由規則排名產生、沒有模型分數 → 不分區間，整條線一個數字；筆＝結果包換股清單的「新買進」
    kind: bundle
    bundles:
      dev: tracks_e_long_nodiv/E0_lw_e0_ctrl_1x.json # 2019-05～2026-02，排序模型 walk-forward
      unseen: tracks_e_vault_nodiv/E0_lw_e0_ctrl_1x.json # 2026-03-02～08-31 金庫期（模型沒看過的半年）
  QUIET: # 潛伏飆股：母體＝當天有分數的股票（模型只對「安靜又買得到」的池子打分）
    kind: score
    model_id: lgbm_quietA20_tu_h20_20260430_655df6d7
    oos_start: 2017-10-02 # walk-forward 樣本外分數起日
    train_end: 2026-04-30 # 正式模型訓練截止：公布日 ≤ 這天＝dev（walk-forward），之後＝unseen（正式模型）
  QUIETV: # 高分爆量：同母體，再加當天爆量
    kind: score
    model_id: lgbm_quietA20_tu_h20_20260430_655df6d7
    oos_start: 2017-10-02
    train_end: 2026-04-30
    volume_window: 20 # 成交量 ≥ 前 20 個交易日平均（不含當天）的……
    volume_ratio_min: 1.5 # ……1.5 倍才算爆量（同 quiet_p35v.yaml 的 require）
