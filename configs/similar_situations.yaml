# 歷史相似情境（完整版，D-182，事前登記：寫於任何相似情境的數字之前；登記後不改，要改＝另開登記）。
# 名單上潛伏飆股／高分爆量的每一檔：在歷史情境庫裡找「大盤狀態相近、個股條件最像」的 k 次，看它們之後 20 天怎麼走。
# 情境庫在本機算一次（因子歷史只在本機），上雲端；雲端每天拿當天名單去比對。只供觀察，不進模型、不進名單。
registration: D-182

# 情境庫的母體：每個交易日有這個模型分數的股票（同 D-179 潛伏母體＝安靜∩流動池）
model_id: lgbm_quietA20_tu_h20_20260430_655df6d7
oos_start: 2017-10-02 # walk-forward 樣本外分數起日
dev_end: 2026-08-31 # 正式庫：賣出日 ≤ 這天、行情只讀到這天；第二保留期 2026-09-09 起一律不碰

# 一筆怎麼算：同 D-179／網站績效逐筆（隔天開盤買、抱 20 個交易日、再隔天開盤賣、扣成本含股利；買不到的不算）
hold_sessions: 20
notional: 666666.67 # 1,000 萬 ÷ 15
lot_size: 1
max_participation: 0.05
big_loss: -0.15 # 「虧超過 15%」＝報酬 ≤ −15%（同 scorecard.trade_stats）
warmup_days: 60

# 怎麼算「像」
# 第一關：大盤狀態——模型的三個大盤特徵，各用情境庫全部交易日的平均與標準差標準化，歐氏距離最近的這個比例的交易日才進第二關
context_features: [ctx.taiex_ma20_dev, ctx.taiex_vol20, ctx.breadth_ma20]
context_keep: 0.25
# 第二關：個股條件——模型吃的值（factor_values.z），加權歐氏距離；權重＝模型 gain 重要度，
# 個股特徵依 gain 由大到小取到累計 ≥ 90%（22 個），重新加總為 1（測試守著：與 model.txt 重算一致）
feature_weights:
  price.atr_14: 0.1734
  price.garman_klass_20: 0.1009
  fundamental.log_market_cap: 0.0837
  fundamental.earnings_yield: 0.0713
  price.high_52w: 0.0645
  fundamental.revenue_yoy: 0.0636
  fundamental.revenue_accel: 0.0541
  price.industry_mom_6m: 0.0512
  price.jump_count_60: 0.0441
  price.ret_skew_60: 0.0326
  chip.short_margin_ratio: 0.0312
  price.bb_squeeze_120: 0.0292
  price.parkinson_20: 0.0278
  chip.trust_net_10d: 0.0253
  price.vp_support_hold_20: 0.0238
  price.industry_rs_20d: 0.0231
  price.mom_60d: 0.0181
  chip.margin_velocity_5d: 0.0179
  chip.foreign_net_10d: 0.0173
  price.overnight_ret_20d: 0.0168
  price.downside_vol_20: 0.0158
  price.ma_tangle: 0.0143
feature_gain_cover: 0.90
min_weight_share: 0.5 # 兩邊都有值的特徵權重合計不到一半 → 這兩個情境不比（缺值不補 0，只算兩邊都有的維度再除以權重和）
k: 200 # 取最像的 200 次
dedupe_sessions: 20 # 同一檔股票公布日相差不到 20 個交易日的情境只取最像的一次（同一段行情不重複算）
examples: 3 # 網站列出最像的 3 次（日期、股票、20 天報酬）

# 高分爆量：模型幾乎不看量（vol_ratio_5d 的 gain 是 0），所以只在「也爆量」的情境裡找；爆量定義同 D-179
surge_lines: [QUIETV]
surge_window: 20 # 成交量 ≥ 前 20 個交易日平均（不含當天）的……
surge_ratio_min: 1.5 # ……1.5 倍
lines: [QUIET, QUIETV]

# 上線前的驗證（只跑一次；看到結果後不調任何參數）
validation:
  library_sell_end: 2026-04-30 # 驗證用情境庫：賣出日 ≤ 正式模型訓練截止
  query_start: 2026-05-01 # 驗證題目：公布日 ≥ 這天、賣出日 ≤ dev_end 的母體情境（模型沒看過的期間）
  min_day_queries: 10 # 一天題目少於這個數，那天不算 RankIC
  bootstrap: 10000 # 以交易日為單位整天一起抽
  seed: 20261015
  ci: 0.95
