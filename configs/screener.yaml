# 策略選股池（SPEC-007 §6 / T-040）——閾值與池展示文案。
# note 的統計出處：主力買賣超研究（2026-07-14；樣本 2022-02~2026-06、隔日開盤進場、
# 20 日均額 ≥ 下限、對全池超額、Newey-West 日聚合 t 值；基準勝率 45.7%）。
# 描述性選股池、非交易訊號；正式因子化走 T-016/T-036。
liquidity_floor_twd: 20000000.0
windows:
  conc: 10
  accum: 60
  ma_fast: 20
  ma_slow: 60
  amt: 20
pct_hi: 0.9
pct_lo: 0.1
yoy_min: 0.2
streak_days: 30
pools:
  - key: main_accum
    name: 主力長線吸籌
    rule: 主力 60 日累積買超佔量比居宇宙前 10%
    note: 研究 10 日勝率 48.2%、超額 +0.42%（t 2.9）；2022–2026 五年皆正（含空頭年）
  - key: chip_revenue
    name: 主力集中×營收
    rule: 主力 10 日集中買超前 10% 且月營收 YoY ≥ 20%
    note: 研究 10 日勝率 48.5%（全表最高）、超額 +0.77%（t 3.1）；2023–2026 四年皆正
  - key: trend_revenue
    name: 趨勢×營收
    rule: 收盤 > MA20 > MA60 且月營收 YoY ≥ 20%
    note: 研究 10 日超額 +1.14%（t 4.1，全表最大）、勝率 46.8%；2023–2026 四年皆正
  - key: triple
    name: 三面向共振
    rule: 主力 10 日集中前 10% ∩ 多頭排列 ∩ YoY ≥ 20%
    note: 研究 10 日勝率 47.0%、超額 +0.71%（t 2.3）；樣本較小，波動較大
  - key: main_distrib
    name: 主力出貨警示
    rule: 主力 60 日累積賣超佔量比居宇宙後 10%（避開名單）
    note: 研究 10 日超額 −0.71%（t −3.4），2023 起逐年惡化；持有者留意、勿接刀
