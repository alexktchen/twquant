# T-072 / SPEC-011：唯一預先登記的 H20 成本感知候選。
horizon_days: 20
aux_horizons: [10, 40]
features:
  - fundamental.revenue_accel
  - fundamental.revenue_yoy
  - price.intraday_ret_20d
  - price.mom_20d
  - price.mom_60d
  - price.overnight_ret_20d
  - price.residual_reversal_5d
  - price.reversal_5d
  - price.rs_market_20d
  - price.vol_20d
  - volume.turnover_z_20d
  - volume.vol_ratio_5d
context_features: []
label:
  execution: next_open
  excess: market_mean
  transform: cost_adjusted_return
  adv_window_sessions: 20
  position_notional_twd: 500_000.0
  downside_penalty: 0.25
  total_return: false # D-054：凍結模型的原始配方＝未含股利；新配置一律 true
split:
  train_min_years: 2.0
  test_months: 3
  embargo_days: 20
  vault_months: 6
  days_per_year: 244
  days_per_month: 21
lgbm:
  num_leaves: 31
  learning_rate: 0.05
  min_data_in_leaf: 100
  feature_fraction: 0.8
  n_estimators: 400
  seed: 42
refit:
  schedule: monthly
trials_log: research_log
