# React 監控儀表板的 nginx：靜態伺服 SPA + 反代 /api 到後端 api 服務。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 反代 /api → docker-compose 的 api 服務（twquant serve，:8000）。
    # 前端以相對路徑 fetch('/api/...')，故與前端同源、免 CORS。
    # 上游用變數＋docker 內建 DNS 每次解析：proxy_pass 寫死主機名時 nginx 只在啟動時解析一次，
    # 部署流程 `up -d --no-deps api` 重建 api 容器後 IP 會換，前端就一直打舊 IP 回 502
    # （2026-09-28 實際發生：api 172.18.0.3 → .4，整頁「推薦快照無法讀取」）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s; # 首次 /api/snapshot 需跑全因子 IC + 回測，容忍較久
    }

    # SPA fallback：非 /api 一律回 index.html（單頁前端自行路由）。
    location / {
        # 整個前端是單一 index.html（JS 內嵌）。沒有 Cache-Control 時瀏覽器會依
        # Last-Modified 做啟發式快取，重新部署後使用者仍看到數小時前的舊版
        # （2026-09-20 實際發生）。no-cache＝每次都帶 ETag 回來問，沒變就 304，幾乎零成本。
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
