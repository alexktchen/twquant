# Cloudflare Pages（T-332）：前端靜態檔＋functions/ 底下的 API（直接連 Supabase）。
# 部署：VITE_APP_MODE=cloud npm run build && npx wrangler pages deploy
# 祕密：npx wrangler pages secret put TWQUANT_PG_DSN --project-name twquant
# 登入（T-439，Supabase Auth）：SUPABASE_URL（驗 Bearer 權杖用的 JWKS 位址）、SUPABASE_JWT_SECRET（只有舊專案 HS256 才要），pages secret put；
# 瀏覽器那邊的 VITE_SUPABASE_URL／VITE_SUPABASE_ANON_KEY 在建置時給（deploy-web.yml）
# 新聞服務（T-400／D-200）：NEWS_API_URL（https://<新聞專案代號>.supabase.co/functions/v1/api）、NEWS_API_KEY（同新聞服務的祕密 NEWS_API_KEY），pages secret put；沒設時新聞分頁顯示「新聞服務還沒設定」
# 即時報價備援（選填）：FUGLE_API_KEY（富果行情 API 金鑰），GitHub repo secret 設了，deploy-web 會自動寫進來
name = "twquant"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 資料庫連線池（Hyperdrive，免費方案可用；2026-10-13 建立，對 Supabase 的 session pooler :5432，查詢快取關閉）。
# 沒有它時每個 API 請求都要自己對 Supabase 做加密連線與密碼驗證，常超過免費方案 10ms CPU 而被砍（error 1102）。
# 本機 `wrangler pages dev` 要先設環境變數 CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE（連線字串，不要寫進這裡）。
# 換密碼或資料庫時：npx wrangler hyperdrive update 3cef1c1a4fcd4715ab0f34534895770f --origin-password ...
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3cef1c1a4fcd4715ab0f34534895770f"

# 盤中大盤體檢（T-397／D-198）：排程 Worker（market-live/）每分鐘寫、/api/warroom/live 讀。2026-10-19 建立。
# 免費方案每天 1,000 次寫入：Worker 一天約 293 次（每分鐘一份＋每天一次股票清單與它切成的 15 段）。
[[kv_namespaces]]
binding = "LIVE"
id = "23ce8c2b93d44078bd9ef5f4de7476d3"
