# Cloudflare Pages（T-332）：前端靜態檔＋functions/ 底下的 API（直接連 Supabase）。
# 部署：VITE_APP_MODE=cloud npm run build && npx wrangler pages deploy
# 祕密：npx wrangler pages secret put TWQUANT_PG_DSN --project-name twquant
# 登出（/api/logout）另需 CF_ACCESS_API_TOKEN（可撤銷 Access 使用者的 token）與 CF_ACCOUNT_ID，同樣用 pages secret put
name = "twquant"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
