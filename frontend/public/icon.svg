<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="twquant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242836"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 神經網路：淡色連線 -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="7" stroke-linecap="round">
    <line x1="112" y1="372" x2="280" y2="322"/>
    <line x1="112" y1="372" x2="168" y2="196"/>
    <line x1="168" y1="196" x2="206" y2="270"/>
    <line x1="168" y1="196" x2="392" y2="142"/>
    <line x1="206" y1="270" x2="392" y2="142"/>
  </g>
  <!-- 主線：模型連成的上漲路徑 -->
  <polyline points="112,372 206,270 280,322 392,142" fill="none" stroke="url(#line)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 節點 -->
  <g fill="#ffffff">
    <circle cx="112" cy="372" r="22"/>
    <circle cx="206" cy="270" r="22"/>
    <circle cx="280" cy="322" r="22"/>
    <circle cx="168" cy="196" r="15" fill-opacity="0.6"/>
  </g>
  <!-- 選中的股票：發光的終點 -->
  <circle cx="392" cy="142" r="48" fill="#FF8A1F" filter="url(#glow)"/>
  <circle cx="392" cy="142" r="32" fill="#FFB547"/>
  <circle cx="392" cy="142" r="15" fill="#ffffff"/>
</svg>
