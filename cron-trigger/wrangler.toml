# D-175：準時觸發雲端每日 pipeline。GitHub Actions 的 schedule 常態晚約 5 小時（2026-10 實測），
# 改由 Cloudflare Cron Trigger 在台北 17:33／21:13 呼叫 workflow_dispatch（帶當天台北日期）。晚上那班 2026-10-13 由 22:43 提早到 21:13。
# 部署：cd cron-trigger && npx wrangler deploy
# 祕密：GITHUB_TOKEN（fine-grained token，只給 alexktchen/twquant 的 Actions: Read and write），
#       在 Cloudflare 後台 Workers → twquant-cron-trigger → Settings → Variables and Secrets 加，或 wrangler secret put。
name = "twquant-cron-trigger"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
# UTC；台北＝UTC+8。MON-FRI 用名稱，避免星期數字從 0 或 1 起算的歧義。平日國定假日交給品質閘門。
# 06:30 台北（UTC 前一天 22:30）：晨報（T-377，morning-brief.yml）；週一早上＝UTC 週日 22:30。
# 21:45 台北（UTC 13:45）：盤後快訊（T-409，同一個 morning-brief.yml 帶 edition=evening），排在 21:13 那班 pipeline 跑完之後。
crons = ["33 9 * * MON-FRI", "13 13 * * MON-FRI", "30 22 * * SUN-THU", "45 13 * * MON-FRI"]

[vars]
GITHUB_REPO = "alexktchen/twquant"
WORKFLOW = "daily-pipeline.yml"
MORNING_WORKFLOW = "morning-brief.yml"
MORNING_CRON = "30 22 * * SUN-THU"
EVENING_CRON = "45 13 * * MON-FRI"

# 保存執行紀錄（含錯誤訊息），Cloudflare 後台 Workers → twquant-cron-trigger → Logs 看得到；觸發失敗時才查得出原因。
[observability]
enabled = true
