[project]
name = "twquant"
version = "0.0.1"
description = "台股系統性量化交易平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "pandera>=0.20",
    "typer>=0.12",
    "requests>=2.31",
    "beautifulsoup4>=4.12", # 富邦DJ 分點 HTML 解析（fubon_chip；內建 html.parser backend）
    "pyyaml>=6.0",
    "tzdata>=2024.1", # Windows/精簡環境無內建 IANA tz 資料庫
    "lightgbm>=4.7.0",
]

[project.scripts]
twquant = "twquant.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "hypothesis>=6.100",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
insight = [
    "anthropic>=0.40",
]
serving = [  # 供應層 PG（SPEC-009）；唯 data/serving 與 monitoring/pg_store 用
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twquant"]

# ── 開發閘門工具設定（CLAUDE.md §2）───────────────────────────────

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
# 不因 .gitignore 而跳過檔案：閘門必須檢查 src/tests 全部原始碼（防「被 ignore 的
# 原始碼靜默逃過 lint」——曾因 data/ 未錨定導致整個資料層漏檢）。
respect-gitignore = false

[tool.ruff.lint]
# 黃金規則的機器化：E/F 基本、I import 排序、B bugbear、UP 現代語法、
# SIM 簡化、RUF。黃金規則 5「禁止靜默處理」以 BLE001（blind except）把關。
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
# E501 行長由 formatter 處理；RUF001-003 是全形標點「歧義字元」警告，
# 對中文為主的程式庫是純噪音（全形括號、逗號本來就該用），關閉。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer 的慣用法：Option/Argument 就是要放在參數預設值，B008 對此為誤報
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
# 第三方庫缺型別 stub 時不擋（polars/duckdb/pandera 自帶或部分缺）
[[tool.mypy.overrides]]
# psycopg 未列於 CI 預設群組（serving 為選用）；缺套件時不擋型別檢查（同 anthropic）。
module = ["duckdb.*", "pandera.*", "pyarrow.*", "yaml.*", "anthropic.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# 警告即失敗（呼應「失敗要大聲」）；但第三方庫的已知棄用另行放行，避免噪音掩蓋我方警告。
filterwarnings = [
    "error",
    # pandera 1.x 在 polars 1.42+ 用了已棄用的 concat(how='horizontal')
    "ignore:the default behavior of:DeprecationWarning",
    # join_asof 附 by 群組時 polars 無法驗證排序旗標（我們已明確 sort，屬 polars 限制）
    "ignore:Sortedness of columns cannot be checked:UserWarning",
]
