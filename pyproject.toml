[project]
name = "twquant"
version = "0.0.1"
description = "台股系統性量化交易平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "pandera>=0.20",
    "typer>=0.12",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # Windows/精簡環境無內建 IANA tz 資料庫
]

[project.scripts]
twquant = "twquant.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twquant"]

# ── 開發閘門工具設定（CLAUDE.md §2）───────────────────────────────

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 黃金規則的機器化：E/F 基本、I import 排序、B bugbear、UP 現代語法、
# SIM 簡化、RUF。黃金規則 5「禁止靜默處理」以 BLE001（blind except）把關。
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
# E501 行長由 formatter 處理；RUF001-003 是全形標點「歧義字元」警告，
# 對中文為主的程式庫是純噪音（全形括號、逗號本來就該用），關閉。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
# 第三方庫缺型別 stub 時不擋（polars/duckdb/pandera 自帶或部分缺）
[[tool.mypy.overrides]]
module = ["duckdb.*", "pandera.*", "pyarrow.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]  # 警告即失敗，呼應「失敗要大聲」
