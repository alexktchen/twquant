# 微台（TMF）模擬用設定。真單另開一份，mode = "live" 且一定要設 daily_loss_limit_twd。
mode = "sim"

[contract]
symbol = "TMF"
point_value = 10.0       # 微型臺指一點 10 元
commission_twd = 15.0    # 每口單邊手續費：先跟現有模擬單一樣用 15 元；待使用者填元大實際費率
tax_rate = 0.00002       # 期交稅：契約價值的十萬分之二

[risk]
min_position = 0         # 只做多
max_position = 1         # 最多 1 口
max_order_qty = 1
max_entries_per_day = 6  # 系統的保險；動能順勢原版自己一天最多進場 2 次
entry_start = "08:45:00"
entry_end = "13:00:00"   # 原版 13:00 清倉，之後不進場
max_quote_age_s = 5.0
force_flat_time = "13:30:00"  # 原版 13:00 自己清倉；這是系統的最後防線
order_timeout_s = 10.0
# daily_loss_limit_twd = 待使用者決定（D-222）；模擬可不設，真單沒設會拒絕啟動
# 期貨商對程式交易的要求（SPEC A-010、D-223）。真單四項都要設，沒設會拒絕啟動。
max_orders_per_minute = 10           # 一分鐘內最多送幾筆委託（含平倉）；到了就暫停送單、要人工解除。數字是 AI 先填的
max_consecutive_broker_rejects = 3   # 連續被券商拒絕幾筆就暫停送單、要人工解除。數字是 AI 先填的
# position_stop_loss_twd = 待使用者決定；單一部位未實現虧損到這個金額就由系統平倉（策略自己另有停損）

[session]
start = "08:45:00"
end = "13:45:00"

[sim]
latency_s = 0.5          # 跟現有模擬單同一個假設：訊號後 0.5 秒的第一筆成交
slippage_points = 1.0    # 市價單每邊滑 1 點

[export]
max_events = 30                  # 給網站的「今日大事」最多留幾則（留最新的）

[momentum]
eval_interval_s = 1.0            # 同現有模擬單：每秒評估一次
market_refresh_s = 30.0
expected_slippage_points = 1.0   # 同 sim.slippage_points
contracts = 1

# 手機通知（SPEC A-006、D-224）。金鑰與收件對象不放這裡，只放 .env：
# AUTOTRADE_TELEGRAM_BOT_TOKEN（機器人的金鑰）、AUTOTRADE_TELEGRAM_CHAT_ID（收件代號）。
# 真單一定要有這一段，而且 kinds 要包含成交與所有異常；下面的數字是 AI 先填的，可以改。
[notify]
channel = "telegram"
name = "微台"                    # 通知裡怎麼稱呼這個商品
# 要通知哪些事：成交、停手（含暫停送單）、解除、停損、部位修正、連線中斷與恢復、被券商拒絕、
# 券商端有不認得的委託、被風控擋下、送出刪單（例如委託太久沒成交）、刪單完成。
# 另有 order（每一筆送出的委託）預設不開：市價單一秒內就成交，成交通知講的是同一件事。
kinds = ["fill", "halt", "release", "stop", "correction", "link", "broker_reject", "foreign_order", "reject", "cancel", "cancelled"]
quiet_routine = true             # 一般通知（成交、解除、連線恢復）靜音送達；「注意」「要處理」一定會響
throttle_s = 300.0               # 同一件事幾秒內不重複通知；超過的合併成一則，視窗空出來時送
burst = 6                        # 同一類通知在 throttle_s 內最多即時送幾則（被擋下這類重複的事固定只送第一則）
timeout_s = 5.0                  # 送一次最多等幾秒
warn_after_attempts = 3          # 一則通知連續失敗幾次就留一筆紀錄（之後還是繼續試，直到送出去或程式結束）
retry_wait_s = 2.0               # 每次重試前等幾秒
queue_size = 200                 # 還沒送出的通知最多排幾則；滿了新的會被丟掉並留紀錄
close_wait_s = 10.0              # 程式結束時最多等幾秒把還沒送的送完

# 第二管道：網站 App（PWA）的推播（SPEC A-006 AC14～AC20、D-224 修訂）。Telegram 照舊收全部；
# 這裡只收 min_level 以上的（預設只有「要處理」），點了打開網站的台指期分頁。
# 用網站同一把 VAPID 私密金鑰（.env 的 TWQUANT_VAPID_PRIVATE_KEY）；裝置的訂閱用 tools/pull_push_subs.py 拉成本機檔案。
[notify_push]
min_level = "act"                # info＝全部、warn＝注意與要處理、act＝只有要處理
url = "https://twquant.pages.dev/?tab=futures"
ttl_s = 3600                     # 手機關機或沒網路時，推播服務最多替我們留 1 小時
timeout_s = 10.0                 # 送一次最多等幾秒
allowed_hosts = ["web.push.apple.com", "fcm.googleapis.com", "updates.push.services.mozilla.com", "notify.windows.com"]  # 同網站 configs/push.yaml
subject = "https://twquant.pages.dev"  # 推播服務出問題時聯絡誰（跟網站一樣，用網址免得公開 email）
