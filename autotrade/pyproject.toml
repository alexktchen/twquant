[project]
name = "autotrade"
version = "0.0.1"
description = "獨立的程式交易系統（期貨）"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yuanta = ["comtypes>=1.4"]
web = ["psycopg[binary]>=3.1"]
push = ["pywebpush>=2.0"]  # 第二管道：網站 App 的推播（A-006 AC14～AC20）
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrade"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"
extend-exclude = ["reference"]  # 原封不動的對照基準，不重排

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "reference.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
